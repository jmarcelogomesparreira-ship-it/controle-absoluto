<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Fazenda | Parreira Gestão</title>
<meta name="description" content="Demonstração: painel de gestão para pecuária de corte. Rebanho, reprodução, ganho de peso, pasto, custos, vendas e livro caixa para o contador. Dados fictícios.">
<meta name="theme-color" content="#F4F6F8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F1A2B'/%3E%3Cpath d='M9 22v-6M16 22V10M23 22v-9' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='9' r='2.4' fill='%235FD3A6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F8;--white:#FFFFFF;--ink:#0F1A2B;--ink-2:#3B4757;--muted:#6B7684;
  --line:#E2E7ED;--line-2:#D3DAE2;--emerald:#0E8A63;--emerald-2:#0B6E4F;--emerald-soft:#E3F3EC;
  --coral:#D9482F;--coral-soft:#FBE9E5;--navy-soft:#E8EDF4;
  --earth:#9A7449;--earth-soft:#F3ECE2;--amber:#9A5B00;--amber-soft:#FFF4E5;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:Figtree,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--emerald);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{padding:14px 0 6px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:26px;height:26px}
.brand b{display:block;font:700 17px/1.15 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;flex:0 0 auto}
.upd i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 3px var(--emerald-soft);margin-right:6px;vertical-align:1px}

/* barra fixa */
.bar{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0 4px}
.sel{position:relative;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;width:100%;font:600 15px var(--body);color:var(--ink);background:var(--white);border:1px solid var(--line-2);border-radius:999px;padding:10px 32px 10px 14px;min-height:46px;cursor:pointer;text-overflow:ellipsis}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;padding:12px 12px 13px;min-height:48px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--emerald)}
.tabs .badge{display:inline-block;min-width:19px;padding:0 5px;margin-left:5px;border-radius:99px;font-size:11.5px;line-height:19px;text-align:center;background:var(--coral);color:#fff;vertical-align:1px}

main{padding:16px 0 24px}
.view{display:none}
.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vh{margin:4px 0 14px}
.vh h1{font:800 26px/1.1 var(--display);letter-spacing:-.025em}
.vh p{color:var(--ink-2);margin-top:4px;max-width:64ch}
.filt-note{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600;color:var(--emerald-2);background:var(--emerald-soft);padding:5px 12px;border-radius:999px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.stack{margin-top:12px}
.col{display:grid;gap:12px;min-width:0;align-content:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{font:700 16.5px/1.25 var(--display);letter-spacing:-.01em}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card .ch small{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.c{color:var(--coral)}.g{color:var(--emerald)}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--white);border:1px solid var(--line);padding:16px 16px 0;margin-bottom:12px}
.hero h1{font:800 25px/1.1 var(--display);letter-spacing:-.025em;position:relative}
.hero p{color:var(--ink-2);margin-top:4px;position:relative;max-width:46ch}
.hero svg{display:block;width:100%;height:44px;margin-top:10px}

/* kpis */
.kpi{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.kpi span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.kpi b{display:block;font:700 22px/1.15 var(--display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.kpi em strong{font-weight:700}
.kpi b.c{color:var(--coral)}.kpi b.g{color:var(--emerald)}
.up{color:var(--emerald-2);font-weight:700}

/* alertas */
.alist{list-style:none}
.alist li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.alist li:first-child{border-top:0;padding-top:4px}
.aic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--navy-soft);color:var(--ink-2)}
.aic svg{width:20px;height:20px}
.aic.hot{background:var(--coral);color:#fff}
.aic.warn{background:var(--amber-soft);color:var(--amber)}
.aic.ok{background:var(--emerald-soft);color:var(--emerald-2)}
.alist .t{font-weight:600;line-height:1.3}
.alist .t small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.go{border:0;background:var(--paper);color:var(--emerald-2);font-weight:700;font-size:14px;cursor:pointer;padding:10px 12px;border-radius:12px;min-height:44px;white-space:nowrap}

/* barras horizontais */
.hb{display:grid;gap:12px}
.hb .l{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.hb .l b{font-weight:600}
.hb .l span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .t{height:10px;background:var(--paper);border-radius:9px;overflow:hidden;position:relative}
.hb .t i{display:block;height:100%;border-radius:9px;background:var(--emerald);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hb .t i.k{background:var(--ink)}.hb .t i.m{background:#9AA5B2}.hb .t i.c{background:var(--coral)}.hb .t i.e{background:var(--earth)}
.hb .t .mark{position:absolute;top:-1px;bottom:-1px;width:3px;border-radius:2px;background:var(--ink)}
.trk{height:12px;background:var(--line);border-radius:9px;overflow:hidden;display:flex}
.trk i{display:block;height:100%;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* listas */
.rows{list-style:none}
.rows li{border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;min-height:56px;width:100%;text-align:left;background:none;border:0}
button.row{cursor:pointer}
.row .nm{font-weight:600;line-height:1.3;min-width:0}
.row .nm small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.row .vl{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .vl small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
button.row:hover .nm{color:var(--emerald-2)}
.more{display:block;width:100%;margin-top:6px;padding:12px;min-height:46px;border:1px dashed var(--line-2);border-radius:12px;background:none;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--navy-soft);color:var(--ink-2)}
.pill.c{background:var(--coral);color:#fff}.pill.cs{background:var(--coral-soft);color:var(--coral)}.pill.g{background:var(--emerald-soft);color:var(--emerald-2)}.pill.w{background:var(--amber-soft);color:var(--amber)}.pill.e{background:var(--earth-soft);color:var(--earth)}

/* gráficos */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;z-index:3}
.tip.on{opacity:1}

/* rebanho fecha */
.eq{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.eq span{color:var(--ink-2)}
.eq b{text-align:right}
.eq .tot{border-top:2px solid var(--ink);padding-top:6px;margin-top:4px;font-weight:700;color:var(--ink)}
.ok-tag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:700;font-size:13.5px;color:var(--emerald-2);background:var(--emerald-soft);padding:6px 12px;border-radius:999px}
.ok-tag svg{width:16px;height:16px}

/* calendário reprodutivo */
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.strip .mh{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.strip .mh.now{color:var(--ink)}
.band{grid-column:var(--a)/var(--b);height:22px;border-radius:6px}
.bl{font-size:13px;font-weight:600;color:var(--ink-2);margin:10px 0 4px}
.nowline{position:relative}

/* lotes */
.lots{display:grid;gap:12px}
.lot{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;width:100%;display:block}
.lot:hover{border-color:var(--ink)}
.lot.sel{border-color:var(--emerald);box-shadow:0 0 0 2px var(--emerald-soft)}
.lot .lh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lot .lh b{font:700 16.5px/1.2 var(--display)}
.lot .lh small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.lot .big{font:700 24px var(--display);margin-top:10px;font-variant-numeric:tabular-nums}
.lot .big small{font:500 13px var(--body);color:var(--muted)}
.lot .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.lot .meta b{color:var(--ink)}

/* pasto */
.pqgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pq{border-radius:14px;padding:12px;background:var(--paper);border:1px solid transparent;min-width:0;text-align:left}
.pq.use{background:var(--emerald-soft)}
.pq.over{background:var(--coral-soft);border-color:#F2C2B8}
.pq.rest{background:var(--earth-soft)}
.pq.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.pq b{display:block;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq .v{font:700 18px var(--display);margin-top:6px;font-variant-numeric:tabular-nums}
.pq .v small{display:inline;font:600 12px var(--body)}
.pq.over .v{color:var(--coral)}
.pq .cap{height:6px;border-radius:9px;background:rgba(15,26,43,.08);margin-top:6px;overflow:hidden}
.pq .cap i{display:block;height:100%;border-radius:9px;background:var(--emerald)}
.pq.over .cap i{background:var(--coral)}
.pq.rest .cap i{background:var(--earth)}

/* tabelas */
.tbw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;padding-left:0}
.tb td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb td:first-child{white-space:normal}.tb.tight td:first-child{white-space:nowrap}
.tb.tight{font-size:13px}.tb.tight th,.tb.tight td{padding-left:4px;padding-right:4px}
.tb tr:last-child td{border-bottom:0}
.tb tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.tb td small{display:block;color:var(--muted);font-size:12px}

/* segmentado */
.seg{display:inline-flex;background:var(--paper);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 14px;min-height:40px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* simulador */
.sim{background:var(--ink);color:#fff;border-radius:18px;padding:18px;border:0}
.sim h2{font:700 18px var(--display);color:#fff}
.sim p.s{color:#B9C3D0;font-size:14px;margin-top:4px}
.sim label{display:block;font-size:13px;font-weight:600;color:#B9C3D0;margin:14px 0 6px}
.sim .sel select{background:#1B2940;border-color:#2C3B55;color:#fff}
.sim .sel::after{border-color:#B9C3D0}
.pricebox{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.pricebox button{height:52px;border-radius:14px;border:0;background:#1B2940;color:#fff;font:700 22px var(--display);cursor:pointer}
.pricebox input{height:52px;width:100%;border-radius:14px;border:1px solid #2C3B55;background:#1B2940;color:#fff;text-align:center;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.sim input[type=range]{width:100%;margin-top:12px;accent-color:#5FD3A6;height:28px}
.simout{margin-top:14px;display:grid;gap:0;border-top:1px solid rgba(255,255,255,.12)}
.simout div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.simout div span{color:#C9D2DD}
.simout .res{border-bottom:0;padding-top:12px}
.simout .res span{color:#fff;font-weight:700}
.simout .res b{font:800 26px var(--display)}
.simout .res b.pos{color:#5FD3A6}.simout .res b.neg{color:#FF8A75}
.simnote{margin-top:10px;font-size:13.5px;color:#C9D2DD;background:#1B2940;border-radius:12px;padding:10px 12px}
.simnote b{color:#fff}

.insight{display:flex;gap:10px;align-items:flex-start;background:var(--emerald-soft);border-radius:12px;padding:12px;font-size:14px}
.insight svg{flex:0 0 18px;width:18px;height:18px;color:var(--emerald-2);margin-top:2px}
.insight.c{background:var(--coral-soft)}.insight.c svg{color:var(--coral)}
.insight.e{background:var(--earth-soft)}.insight.e svg{color:var(--earth)}

.dl{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;font-weight:700;font-size:15px;padding:12px 18px;min-height:48px;cursor:pointer;text-decoration:none}
.dl svg{width:18px;height:18px}
.dl.line{background:var(--white);color:var(--ink);border:1px solid var(--line-2)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* detalhe */
.scrim{position:fixed;inset:0;background:rgba(15,26,43,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--white);border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;padding:8px 16px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line-2);margin:4px auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-h h3{font:800 22px/1.15 var(--display);letter-spacing:-.02em}
.sh-h p{color:var(--muted);font-size:13.5px;margin-top:3px}
.xbtn{flex:0 0 46px;width:46px;height:46px;border-radius:14px;border:0;background:var(--paper);cursor:pointer;display:grid;place-items:center}
.xbtn svg{width:20px;height:20px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.kv div{background:var(--paper);border-radius:12px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{display:block;font:700 17px var(--display);margin-top:2px;font-variant-numeric:tabular-nums}
.sec{margin-top:18px}
.sec h4{font:700 15px var(--display);margin-bottom:8px}

footer{padding:8px 0 40px}
.cta{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;justify-items:start}
.cta p{font:700 18px/1.25 var(--display);letter-spacing:-.015em}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--emerald);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 20px;border-radius:999px;min-height:54px;width:100%}
.wa:hover{background:var(--emerald-2)}
.wa svg{width:20px;height:20px}
.disc{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.disc a{color:inherit}

@media (min-width:720px){
  .wrap{padding:0 24px}
  .tabs{margin:0 -24px;padding:0 24px}
  .filters{grid-template-columns:260px 300px;justify-content:start}
  .k3{grid-template-columns:repeat(3,1fr)!important}
  .k4{grid-template-columns:repeat(4,1fr)!important}
  .split{grid-template-columns:1.2fr 1fr}
  .split2{grid-template-columns:1fr 1fr}
  .lots{grid-template-columns:1fr 1fr}
  .pqgrid{grid-template-columns:repeat(3,1fr)}
  .vh h1,.hero h1{font-size:32px}
  .kpi b{font-size:26px}
  .cta{grid-template-columns:1fr auto;align-items:center}
  .wa{width:auto}
  .sheet{left:auto;top:0;bottom:0;width:480px;max-height:none;border-radius:20px 0 0 20px;transform:translateX(105%);padding:18px 22px}
  .grab{display:none}
  .hero svg{height:60px}
}
@media (min-width:1024px){.pqgrid{grid-template-columns:repeat(4,1fr)}.lots{grid-template-columns:repeat(3,1fr)}}
@media (max-width:370px){.kpi b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">

var PQ=[
  ['Córrego',55,'Marandu'],['Sede',52,'Marandu'],['Baixada',48,'Marandu'],['Aroeira',50,'Piatã'],
  ['Cascalho',44,'Marandu'],['Mangueiro',46,'Marandu'],['Represa',30,'Piatã'],['Lagoa',28,'Piatã'],
  ['Cerradinho',26,'Decumbens'],['Estrada',28,'Decumbens'],['Pequi',42,'Mombaça'],['Buriti',40,'Mombaça'],

var CAPIM={'Mombaça':4.2,'Marandu':3.6,'Piatã':3.3,'Decumbens':2.8};

var AREA=sum(PQ,function(p){return p.ha});
var COSTCATS=['Sal mineral','Ração e suplementos','Sanidade','Mão de obra','Combustível','Manutenção','Arrendamento'];
var PSER=[318,322,320,326,321,314,306,312,330,345,360,371];

/* =========================================================

   ========================================================= */
var L=LOTS.map(function(){return{n:{},w:{},cost:0}});
function setL(id,cat,q,w){L[id].n[cat]=q;L[id].w[cat]=w}
setL(0,'Vacas',140,440);setL(0,'Bezerros',0,32);setL(1,'Vacas',120,440);setL(1,'Bezerros',0,32);
setL(2,'Novilhas',100,300);setL(3,'Garrotes',100,260);setL(4,'Garrotes',70,280);setL(5,'Bois',90,430);setL(6,'Bois',60,420);setL(7,'Touros',12,780);
function N(id,cat){return L[id].n[cat]||0}
function lotHeads(id){var s=0;for(var c in L[id].n)s+=L[id].n[c];return s}

function snap(){return L.map(function(l){return{n:Object.assign({},l.n),w:Object.assign({},l.w),cost:l.cost}})}
var REC=[],SEASON={total:210,exp:262,prenhes:218},SEAS={};
function mkRec(g){return{g:g,price:price(g.t),lots:LOTS.map(function(){return{birth:{},buy:{},sell:{},death:{},tin:{},tout:{},gain:0,alloc:0,buyVal:0,gmd:null,meta:null}}),sales:[],buys:[],opex:{},budget:{}}}

function opexFor(g){

  b['Sal mineral']=6200;o['Sal mineral']=6200*(.95+r(1)*.1);

  var san={0:3200,1:1200,2:5200,4:7000,5:3500,6:7000,8:7000,9:5500,10:3800,11:3200};

function step(g){
  var m=g.m,dm=dim(g),rec=mkRec(g),cur=isCur(g),pr=price(g.t);

  if(m===2)move(rec,3,'Garrotes',5,'Bois',N(3,'Garrotes'));
  if(m===8){var need=262-N(0,'Vacas')-N(1,'Vacas'),q=Math.max(0,Math.min(need,Math.floor(N(2,'Novilhas')*.6))),q1=Math.ceil(q*.54);
    move(rec,2,'Novilhas',0,'Vacas',q1);move(rec,2,'Novilhas',1,'Vacas',q-q1)}

  if(m===3||m===4){var q=(m===3?38:28)+Math.floor(hr(g.t,5)*5),w=196+hr(g.t,6)*10,val=Math.round(q*w*pkg);
    var old=N(4,'Garrotes'),ow=L[4].w.Garrotes||w;L[4].n.Garrotes=old+q;L[4].w.Garrotes=(old*ow+q*w)/(old+q);L[4].cost+=val;
    add(rec.lots[4].buy,'Garrotes',q);rec.lots[4].buyVal+=val;rec.buys.push({lot:4,cat:'Garrotes',n:q,kg:w,val:val,day:12,desc:'Compra de '+q+' bezerros desmamados'})}
  if(m===7){var val2=2*14500,old2=N(7,'Touros');L[7].w.Touros=(old2*L[7].w.Touros+2*760)/(old2+2);L[7].n.Touros=old2+2;L[7].cost+=val2;
    add(rec.lots[7].buy,'Touros',2);rec.lots[7].buyVal+=val2;rec.buys.push({lot:7,cat:'Touros',n:2,kg:760,val:val2,day:6,desc:'Compra de 2 touros Nelore PO'})}
  /* 3. nascimentos (parição ago–nov) */
  var BSH={7:.3,8:.4,9:.23,10:.07};
  if(BSH[m]!=null){var tot=Math.round(SEASON.total*BSH[m]),v0=N(0,'Vacas'),v1=N(1,'Vacas'),b0=Math.round(tot*v0/(v0+v1)),b1=tot-b0;
    [[0,b0],[1,b1]].forEach(function(x){var id=x[0],q=x[1],o=N(id,'Bezerros');L[id].w.Bezerros=o+q>0?(o*(L[id].w.Bezerros||32)+q*32)/(o+q):32;L[id].n.Bezerros=o+q;add(rec.lots[id].birth,'Bezerros',q)});
  }

  /* 4. desmama (mar–jul) */
  var DF={2:.08,3:.35,4:.55,5:.8,6:1};
  if(DF[m]!=null){[0,1].forEach(function(id){var b=N(id,'Bezerros'),q=Math.round(b*DF[m]);if(q<=0)return;var cs=L[id].cost*(q/b)*.85,ma=Math.floor(q/2),fe=q-ma;
    move(rec,id,'Bezerros',3,'Garrotes',ma,cs*ma/q);move(rec,id,'Bezerros',2,'Novilhas',fe,cs*fe/q);
    })}

  var ag=aguas(m)?0:1;
  LOTS.forEach(function(lt){var id=lt.id,gain=0;
    for(var c in L[id].n){var q=L[id].n[c];if(!q)continue;var meta=GM[c][ag],act=(c==='Vacas'||c==='Touros')?meta:meta*lt.perf*(.94+hr(g.t,id,c.length)*.12);
      L[id].w[c]+=act*dm;gain+=q*act*dm;if(c===lt.grow){rec.lots[id].gmd=act;rec.lots[id].meta=meta}}
    rec.lots[id].gain=gain});

  LOTS.forEach(function(lt){var id=lt.id;for(var c in L[id].n){var q=L[id].n[c];if(!q)continue;
    var rate=c==='Bezerros'?(m>=7&&m<=11?.012:.004):.0011,d=Math.floor(q*rate*dm/30+hr(g.t,id,c.length,3));
    if(d>0){d=Math.min(d,q);var kg=lotKg(id);L[id].n[c]-=d;add(rec.lots[id].death,c,d)}}});
  /* 7. vendas */
  function sell(id,cat,q,yld,kind){
    q=Math.min(q,N(id,cat));if(q<=0)return;
    var day=8+Math.floor(hr(g.t,id,cat.length,11)*15);if(cur&&day>TD)return;
    var w=L[id].w[cat],kg=lotKg(id),cogs=kg>0?L[id].cost*q*w/kg:0,arr=q*w*yld/15;

  if(m===11)sell(5,'Bois',Math.round(N(5,'Bois')*.45),.535);
  if(m===0)sell(5,'Bois',Math.round(N(5,'Bois')*.6),.535);
  if(m===1)sell(5,'Bois',N(5,'Bois'),.535);
  if(m===9)sell(6,'Bois',Math.round(N(6,'Bois')*.4),.535);
  if(m===10)sell(6,'Bois',N(6,'Bois'),.535);
  if(m===5){sell(0,'Vacas',Math.round(N(0,'Vacas')*.12),.5,'vaca');sell(1,'Vacas',Math.round(N(1,'Vacas')*.12),.5,'vaca')}
  if(m===6){sell(0,'Vacas',Math.round(N(0,'Vacas')*.09),.5,'vaca');sell(1,'Vacas',Math.round(N(1,'Vacas')*.09),.5,'vaca');sell(7,'Touros',2,.5,'vaca')}

  var ox=opexFor(g);rec.opex=ox.o;rec.budget=ox.b;
  var tot3=sum(COSTCATS,function(k){return ox.o[k]}),ua=LOTS.map(function(lt){return lotKg(lt.id)/450}),uat=sum(ua);
  LOTS.forEach(function(lt){var a=uat?tot3*ua[lt.id]/uat:0;L[lt.id].cost+=a;rec.lots[lt.id].alloc=a});

G.forEach(function(g){REC.push(step(g))});
var W12=REC.slice(WARM);
/* estação em andamento */

/* ---------- consultas ---------- */
function R_(i){return W12[i]}
function heads(snapL,lot){var s={};CATS.forEach(function(c){s[c]=0});snapL.forEach(function(l,id){if(lot!=null&&lot!=='all'&&+lot!==id)return;for(var c in l.n)s[c]+=l.n[c]});return s}
function tot(o){var s=0;for(var k in o)s+=o[k];return s}

function salesIn(i0,i1,lot){var a=[];for(var i=i0;i<=i1;i++)W12[i].sales.forEach(function(s){if(lot==='all'||+lot===s.lot)a.push(s)});return a}
function costIn(i0,i1,lot){var s=0;for(var i=i0;i<=i1;i++){var r=W12[i];s+=lot==='all'?sum(COSTCATS,function(k){return r.opex[k]})+sum(r.buys,function(b){return b.val}):r.lots[+lot].alloc+r.lots[+lot].buyVal}return s}
function opexIn(i0,i1,lot){var s=0;for(var i=i0;i<=i1;i++){var r=W12[i];s+=lot==='all'?sum(COSTCATS,function(k){return r.opex[k]}):r.lots[+lot].alloc}return s}

/* ---------- pasto ---------- */
var EPOCH=new Date(2020,0,1);
function pasture(i){
  var g=MONTHS[i],ref=refDate(g),snapL=W12[i].end,cf=capFactor(g.m),out=[];
  PQ.forEach(function(p){out.push({p:p,lot:null,ua:0,cap:CAPIM[p.capim]*cf,state:'rest',dias:0})});
  LOTS.forEach(function(lt){
    var hdz=sum(Object.keys(snapL[lt.id].n),function(c){return snapL[lt.id].n[c]});
    var d=days(EPOCH,ref)+lt.id*7,ph=Math.floor(d/lt.P)%2,inP=d%lt.P;

}

function simCalc(id,p){

  h+='</tbody><tfoot><tr><td>Total</td><td>'+mil(R)+'</td><td>'+mil(D)+'</td><td>'+mil(R-D)+'</td></tr></tfoot></table></div><p class="muted" style="font-size:13px;margin-top:10px">Mês com resultado negativo é normal na pecuária: a venda do boi vem em poucos meses do ano e a despesa vem todo mês.</p></div>';
  h+='<div class="grid split2 stack"><div class="card"><div class="ch"><h2>Despesas por categoria</h2><small>12 meses</small></div><div class="hb">';
  var dc=DESP.map(function(c){return{c:c,v:sum(LEDGER.filter(function(x){return x.c===c}),function(x){return x.v})}}).sort(function(a,b){return b.v-a.v}),mx=dc[0].v;
  dc.forEach(function(x){h+='<div><div class="l"><b>'+x.c+'</b><span>'+R$(x.v)+' · '+pct(x.v/D*100,0)+'</span></div><div class="t"><i class="'+(x.c==='Compra de animais'?'e':'k')+'" data-w="'+(x.v/mx*100)+'"></i></div></div>'});
  h+='</div></div>';
  var me=rows[i].e;
  h+='<div class="card"><div class="ch"><h2>Lançamentos de '+MN[g.m]+'</h2><small>'+me.length+' lançamentos</small></div><ul class="rows">'+me.map(function(x){return '<li><div class="row"><span class="nm">'+esc(x.h)+'<small>'+ddmm(x.d)+' · '+x.c+'</small></span><span class="vl '+(x.tp==='Receita'?'up':'')+'">'+(x.tp==='Receita'?'+':'−')+R$(x.v)+'</span></div></li>'}).join('')+'</ul></div></div>';
  $('v-contador').innerHTML=h;
  $('csvAll').onclick=function(){csv(LEDGER,'fazenda-exemplo-livro-caixa-12-meses.csv')};
  $('csvMonth').onclick=function(){csv(LEDGER.filter(function(x){return x.k===i}),'fazenda-exemplo-livro-caixa-'+MN[g.m].toLowerCase()+'-'+g.y+'.csv')};
}
function csv(list,name){
  var lines=['Data;Histórico;Categoria;Tipo;Valor (R$)'];
  list.forEach(function(x){lines.push([ddmmyy(x.d),'"'+x.h.replace(/"/g,'""')+'"',x.c,x.tp,(x.tp==='Despesa'?'-':'')+n2(x.v).replace(/\./g,'')].join(';'))});
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}

/* =========================================================
   Detalhe do lote
   ========================================================= */
var lastFocus=null;
function openLot(id){
  var i=ST.mi,x=lotInfo(i,id),lt=x.lt,r=W12[i];
  var h='<div class="grab"></div><div class="sh-h"><div><h3 id="shTitle">'+lt.n+'</h3><p>'+lt.k+' · '+(x.hz?CATS.filter(function(c){return x.sn.n[c]}).map(function(c){return x.sn.n[c]+' '+c.toLowerCase()}).join(' + '):'lote vazio')+'</p></div><button class="xbtn" type="button" id="shX" aria-label="Fechar">'+IC.x+'</button></div>';
  var hz=x.hz||1;
  h+='<div class="kv"><div><span>Animais</span><b>'+n(x.hz)+'</b></div><div><span>Peso médio</span><b>'+(x.hz?n(x.w)+' kg':'—')+'</b></div><div><span>GMD no mês</span><b class="'+(x.gmd!=null&&x.meta&&x.gmd<x.meta*.88?'c':'')+'">'+(x.gmd!=null&&x.hz?n2(x.gmd)+' kg':'—')+'</b></div><div><span>Meta de GMD</span><b>'+(x.meta?n2(x.meta)+' kg':'—')+'</b></div><div><span>Custo acumulado</span><b>'+mil(x.cost)+'</b></div><div><span>Custo por cabeça</span><b>'+(x.hz?R$(x.cost/hz):'—')+'</b></div></div>';
  if(x.prev){var slow=x.meta&&x.gmd<x.meta*.88,dm_=slow?Math.ceil((TARGET[x.cat][0]-x.w)/x.meta):0;
    h+='<div class="insight'+(slow?' c':'')+'" style="margin-top:12px">'+(slow?IC.down:IC.scale)+'<div>No ritmo de hoje, o lote chega em '+n(TARGET[x.cat][0])+' kg ('+x.prev.lab+') por volta de <b>'+ddmmyy(x.prev.date)+'</b>, daqui a '+n(x.prev.d)+' dias.'+(slow?' Na meta de GMD seriam '+n(dm_)+' dias: são <b>'+n(x.prev.d-dm_)+' dias a mais</b> de pasto e custo.':'')+'</div></div>'}
  var ps=pasture(i).filter(function(p){return p.lot&&p.lot.id===id})[0];
  if(ps)h+='<div class="insight '+(ps.state==='over'?'c':'e')+'" style="margin-top:8px">'+IC.grass+'<div>Está no piquete <b>'+ps.p.n+'</b> ('+ps.p.ha+' ha de '+ps.p.capim+') há '+ps.dias+' dias. Lotação de '+n2(ps.lot_)+' UA/ha'+(ps.state==='over'?', acima dos '+n2(ps.cap)+' que o capim aguenta.':'.')+'</div></div>';
  h+='<div class="sec"><h4>Peso médio, 12 meses</h4>'+chartBox('cLot',150)+'</div>';
  /* movimentos */
  var mv=[];MONTHS.forEach(function(g,k){if(k>i)return;var y=W12[k].lots[id];
    for(var c in y.birth)if(y.birth[c])mv.push([k,'Nasceram '+y.birth[c]+' bezerros']);
    for(var c2 in y.buy)if(y.buy[c2])mv.push([k,'Compra de '+y.buy[c2]+' '+c2.toLowerCase()+' ('+R$(y.buyVal)+')']);
    for(var c3 in y.tin)if(y.tin[c3])mv.push([k,'Entraram '+y.tin[c3]+' '+c3.toLowerCase()]);
    for(var c4 in y.tout)if(y.tout[c4])mv.push([k,'Saíram '+y.tout[c4]+' '+c4.toLowerCase()+(c4==='Bezerros'?' (desmama)':'')]);
    for(var c5 in y.sell)if(y.sell[c5])mv.push([k,'Venda de '+y.sell[c5]+' '+c5.toLowerCase()]);
    for(var c6 in y.death)if(y.death[c6])mv.push([k,y.death[c6]+' '+(y.death[c6]>1?'mortes':'morte')+' ('+c6.toLowerCase()+')']);});
  h+='<div class="sec"><h4>Movimentos</h4>'+(mv.length?'<ul class="rows">'+hideFrom(mv.reverse().map(function(z){return '<li><div class="row" style="min-height:44px;padding:8px 0"><span class="nm" style="font-weight:500">'+z[1]+'</span><span class="vl"><small>'+mlab(MONTHS[z[0]])+'</small></span></div></li>'}).join(''),8)+'</ul>'+moreBtn(mv.length,8):'<p class="muted">Sem movimentos no período.</p>')+'</div>';
  var se=SANEV.filter(function(e){return e.lot===id&&(e.st!=='ok'||days(e.due,TODAY)<=120)});
  h+='<div class="sec"><h4>Sanitário</h4>'+(se.length?'<ul class="rows">'+se.slice(-6).map(function(e){return '<li><div class="row" style="min-height:48px;padding:8px 0"><span class="nm">'+e.s.n+'<small>'+ddmm(e.due)+' · '+e.doses+' doses</small></span><span class="vl">'+stLabel(e)+'</span></div></li>'}).join('')+'</ul>':'<p class="muted">Nada programado.</p>')+'</div>';
  var sh=$('sheet');sh.innerHTML=h;sh.scrollTop=0;lastFocus=document.activeElement;
  $('scrim').classList.add('on');sh.classList.add('on');sh.setAttribute('aria-hidden','false');
  $('shX').onclick=closeLot;setTimeout(function(){$('shX').focus({preventScroll:true})},60);
  var c=lt.grow||'Touros';
  lines12('cLot',[{n:'Peso',c:'#0E8A63',v:MONTHS.map(function(_,k){var sn=W12[k].end[id];return sn.n[c]?sn.w[c]:null})}],{ax:function(v){return n(v)},tf:function(v){return n(v)+' kg'},label:'Peso médio do lote'});
}
function closeLot(){var sh=$('sheet');sh.classList.remove('on');$('scrim').classList.remove('on');sh.setAttribute('aria-hidden','true');if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
$('scrim').onclick=closeLot;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('sheet').classList.contains('on'))closeLot()});
(function(){var sh=$('sheet'),y0=null;sh.addEventListener('touchstart',function(e){y0=sh.scrollTop<=0?e.touches[0].clientY:null},{passive:true});sh.addEventListener('touchend',function(e){if(y0!=null&&e.changedTouches[0].clientY-y0>90)closeLot();y0=null},{passive:true})})();

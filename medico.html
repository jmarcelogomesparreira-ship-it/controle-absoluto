<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Consultório | Parreira Gestão</title>
<meta name="description" content="Demonstração: painel de gestão para consultório médico. Receita por fonte, convênios e repasses, glosas, agenda e faltas, plantões, procedimentos e fechamento para o contador. Dados fictícios e agregados.">
<meta name="theme-color" content="#F4F6F8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F1A2B'/%3E%3Cpath d='M9 22v-6M16 22V10M23 22v-9' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='9' r='2.4' fill='%235FD3A6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#F4F6F8;--white:#FFFFFF;--ink:#0F1A2B;--ink-2:#3B4757;--muted:#6B7684;
  --line:#E2E7ED;--line-2:#D3DAE2;--emerald:#0E8A63;--emerald-2:#0B6E4F;--emerald-soft:#E3F3EC;
  --coral:#D9482F;--coral-soft:#FBE9E5;--navy-soft:#E8EDF4;
  --earth:#9A7449;--earth-soft:#F3ECE2;--amber:#9A5B00;--amber-soft:#FFF4E5;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:Figtree,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--emerald);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{padding:14px 0 6px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:26px;height:26px}
.brand b{display:block;font:700 17px/1.15 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;flex:0 0 auto}
.upd i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 3px var(--emerald-soft);margin-right:6px;vertical-align:1px}

/* barra fixa */
.bar{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0 4px}
.sel{position:relative;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;width:100%;font:600 15px var(--body);color:var(--ink);background:var(--white);border:1px solid var(--line-2);border-radius:999px;padding:10px 32px 10px 14px;min-height:46px;cursor:pointer;text-overflow:ellipsis}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;padding:12px 12px 13px;min-height:48px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--emerald)}
.tabs .badge{display:inline-block;min-width:19px;padding:0 5px;margin-left:5px;border-radius:99px;font-size:11.5px;line-height:19px;text-align:center;background:var(--coral);color:#fff;vertical-align:1px}

main{padding:16px 0 24px}
.view{display:none}
.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vh{margin:4px 0 14px}
.vh h1{font:800 26px/1.1 var(--display);letter-spacing:-.025em}
.vh p{color:var(--ink-2);margin-top:4px;max-width:64ch}
.filt-note{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600;color:var(--emerald-2);background:var(--emerald-soft);padding:5px 12px;border-radius:999px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.stack{margin-top:12px}
.col{display:grid;gap:12px;min-width:0;align-content:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{font:700 16.5px/1.25 var(--display);letter-spacing:-.01em}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card .ch small{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.c{color:var(--coral)}.g{color:var(--emerald)}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--white);border:1px solid var(--line);padding:16px 16px 0;margin-bottom:12px}
.hero h1{font:800 25px/1.1 var(--display);letter-spacing:-.025em;position:relative}
.hero p{color:var(--ink-2);margin-top:4px;position:relative;max-width:46ch}
.hero svg{display:block;width:100%;height:44px;margin-top:10px}

/* kpis */
.kpi{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.kpi span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.kpi b{display:block;font:700 22px/1.15 var(--display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.kpi em strong{font-weight:700}
.kpi b.c{color:var(--coral)}.kpi b.g{color:var(--emerald)}
.up{color:var(--emerald-2);font-weight:700}

/* alertas */
.alist{list-style:none}
.alist li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.alist li:first-child{border-top:0;padding-top:4px}
.aic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--navy-soft);color:var(--ink-2)}
.aic svg{width:20px;height:20px}
.aic.hot{background:var(--coral);color:#fff}
.aic.warn{background:var(--amber-soft);color:var(--amber)}
.aic.ok{background:var(--emerald-soft);color:var(--emerald-2)}
.alist .t{font-weight:600;line-height:1.3}
.alist .t small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.go{border:0;background:var(--paper);color:var(--emerald-2);font-weight:700;font-size:14px;cursor:pointer;padding:10px 12px;border-radius:12px;min-height:44px;white-space:nowrap}

/* barras horizontais */
.hb{display:grid;gap:12px}
.hb .l{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.hb .l b{font-weight:600}
.hb .l span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .t{height:10px;background:var(--paper);border-radius:9px;overflow:hidden;position:relative}
.hb .t i{display:block;height:100%;border-radius:9px;background:var(--emerald);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hb .t i.k{background:var(--ink)}.hb .t i.m{background:#9AA5B2}.hb .t i.c{background:var(--coral)}.hb .t i.e{background:var(--earth)}
.hb .t .mark{position:absolute;top:-1px;bottom:-1px;width:3px;border-radius:2px;background:var(--ink)}
.trk{height:12px;background:var(--line);border-radius:9px;overflow:hidden;display:flex}
.trk i{display:block;height:100%;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* listas */
.rows{list-style:none}
.rows li{border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;min-height:56px;width:100%;text-align:left;background:none;border:0}
button.row{cursor:pointer}
.row .nm{font-weight:600;line-height:1.3;min-width:0}
.row .nm small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.row .vl{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .vl small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
button.row:hover .nm{color:var(--emerald-2)}
.more{display:block;width:100%;margin-top:6px;padding:12px;min-height:46px;border:1px dashed var(--line-2);border-radius:12px;background:none;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--navy-soft);color:var(--ink-2)}
.pill.c{background:var(--coral);color:#fff}.pill.cs{background:var(--coral-soft);color:var(--coral)}.pill.g{background:var(--emerald-soft);color:var(--emerald-2)}.pill.w{background:var(--amber-soft);color:var(--amber)}.pill.e{background:var(--earth-soft);color:var(--earth)}

/* gráficos */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;z-index:3}
.tip.on{opacity:1}

/* rebanho fecha */
.eq{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.eq span{color:var(--ink-2)}
.eq b{text-align:right}
.eq .tot{border-top:2px solid var(--ink);padding-top:6px;margin-top:4px;font-weight:700;color:var(--ink)}
.ok-tag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:700;font-size:13.5px;color:var(--emerald-2);background:var(--emerald-soft);padding:6px 12px;border-radius:999px}
.ok-tag svg{width:16px;height:16px}

/* calendário reprodutivo */
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.strip .mh{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.strip .mh.now{color:var(--ink)}
.band{grid-column:var(--a)/var(--b);height:22px;border-radius:6px}
.bl{font-size:13px;font-weight:600;color:var(--ink-2);margin:10px 0 4px}
.nowline{position:relative}

/* lotes */
.lots{display:grid;gap:12px}
.lot{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;width:100%;display:block}
.lot:hover{border-color:var(--ink)}
.lot.sel{border-color:var(--emerald);box-shadow:0 0 0 2px var(--emerald-soft)}
.lot .lh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lot .lh b{font:700 16.5px/1.2 var(--display)}
.lot .lh small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.lot .big{font:700 24px var(--display);margin-top:10px;font-variant-numeric:tabular-nums}
.lot .big small{font:500 13px var(--body);color:var(--muted)}
.lot .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.lot .meta b{color:var(--ink)}

/* pasto */
.pqgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pq{border-radius:14px;padding:12px;background:var(--paper);border:1px solid transparent;min-width:0;text-align:left}
.pq.use{background:var(--emerald-soft)}
.pq.over{background:var(--coral-soft);border-color:#F2C2B8}
.pq.rest{background:var(--earth-soft)}
.pq.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.pq b{display:block;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq .v{font:700 18px var(--display);margin-top:6px;font-variant-numeric:tabular-nums}
.pq .v small{display:inline;font:600 12px var(--body)}
.pq.over .v{color:var(--coral)}
.pq .cap{height:6px;border-radius:9px;background:rgba(15,26,43,.08);margin-top:6px;overflow:hidden}
.pq .cap i{display:block;height:100%;border-radius:9px;background:var(--emerald)}
.pq.over .cap i{background:var(--coral)}
.pq.rest .cap i{background:var(--earth)}

/* tabelas */
.tbw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;padding-left:0}
.tb td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb td:first-child{white-space:normal}.tb.tight td:first-child{white-space:nowrap}
.tb.tight{font-size:13px}.tb.tight th,.tb.tight td{padding-left:4px;padding-right:4px}
.tb tr:last-child td{border-bottom:0}
.tb tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.tb td small{display:block;color:var(--muted);font-size:12px}

/* segmentado */
.seg{display:inline-flex;background:var(--paper);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 14px;min-height:40px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* simulador */
.sim{background:var(--ink);color:#fff;border-radius:18px;padding:18px;border:0}
.sim h2{font:700 18px var(--display);color:#fff}
.sim p.s{color:#B9C3D0;font-size:14px;margin-top:4px}
.sim label{display:block;font-size:13px;font-weight:600;color:#B9C3D0;margin:14px 0 6px}
.sim .sel select{background:#1B2940;border-color:#2C3B55;color:#fff}
.sim .sel::after{border-color:#B9C3D0}
.pricebox{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.pricebox button{height:52px;border-radius:14px;border:0;background:#1B2940;color:#fff;font:700 22px var(--display);cursor:pointer}
.pricebox input{height:52px;width:100%;border-radius:14px;border:1px solid #2C3B55;background:#1B2940;color:#fff;text-align:center;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.sim input[type=range]{width:100%;margin-top:12px;accent-color:#5FD3A6;height:28px}
.simout{margin-top:14px;display:grid;gap:0;border-top:1px solid rgba(255,255,255,.12)}
.simout div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.simout div span{color:#C9D2DD}
.simout .res{border-bottom:0;padding-top:12px}
.simout .res span{color:#fff;font-weight:700}
.simout .res b{font:800 26px var(--display)}
.simout .res b.pos{color:#5FD3A6}.simout .res b.neg{color:#FF8A75}
.simnote{margin-top:10px;font-size:13.5px;color:#C9D2DD;background:#1B2940;border-radius:12px;padding:10px 12px}
.simnote b{color:#fff}

.insight{display:flex;gap:10px;align-items:flex-start;background:var(--emerald-soft);border-radius:12px;padding:12px;font-size:14px}
.insight svg{flex:0 0 18px;width:18px;height:18px;color:var(--emerald-2);margin-top:2px}
.insight.c{background:var(--coral-soft)}.insight.c svg{color:var(--coral)}
.insight.e{background:var(--earth-soft)}.insight.e svg{color:var(--earth)}

.dl{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;font-weight:700;font-size:15px;padding:12px 18px;min-height:48px;cursor:pointer;text-decoration:none}
.dl svg{width:18px;height:18px}
.dl.line{background:var(--white);color:var(--ink);border:1px solid var(--line-2)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* detalhe */
.scrim{position:fixed;inset:0;background:rgba(15,26,43,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--white);border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;padding:8px 16px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line-2);margin:4px auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-h h3{font:800 22px/1.15 var(--display);letter-spacing:-.02em}
.sh-h p{color:var(--muted);font-size:13.5px;margin-top:3px}
.xbtn{flex:0 0 46px;width:46px;height:46px;border-radius:14px;border:0;background:var(--paper);cursor:pointer;display:grid;place-items:center}
.xbtn svg{width:20px;height:20px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.kv div{background:var(--paper);border-radius:12px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{display:block;font:700 17px var(--display);margin-top:2px;font-variant-numeric:tabular-nums}
.sec{margin-top:18px}
.sec h4{font:700 15px var(--display);margin-bottom:8px}

footer{padding:8px 0 40px}
.cta{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;justify-items:start}
.cta p{font:700 18px/1.25 var(--display);letter-spacing:-.015em}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--emerald);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 20px;border-radius:999px;min-height:54px;width:100%}
.wa:hover{background:var(--emerald-2)}
.wa svg{width:20px;height:20px}
.disc{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.disc a{color:inherit}

@media (min-width:720px){
  .wrap{padding:0 24px}
  .tabs{margin:0 -24px;padding:0 24px}
  .filters{grid-template-columns:260px 300px;justify-content:start}
  .k3{grid-template-columns:repeat(3,1fr)!important}
  .k4{grid-template-columns:repeat(4,1fr)!important}
  .split{grid-template-columns:1.2fr 1fr}
  .split2{grid-template-columns:1fr 1fr}
  .lots{grid-template-columns:1fr 1fr}
  .pqgrid{grid-template-columns:repeat(3,1fr)}
  .vh h1,.hero h1{font-size:32px}
  .kpi b{font-size:26px}
  .cta{grid-template-columns:1fr auto;align-items:center}
  .wa{width:auto}
  .sheet{left:auto;top:0;bottom:0;width:480px;max-height:none;border-radius:20px 0 0 20px;transform:translateX(105%);padding:18px 22px}
  .grab{display:none}
  .hero svg{height:60px}
}
@media (min-width:1024px){.pqgrid{grid-template-columns:repeat(4,1fr)}.lots{grid-template-columns:repeat(3,1fr)}}
@media (max-width:370px){.kpi b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.top .brand{flex:1 1 auto}
.heat{display:grid;grid-template-columns:34px repeat(10,1fr);gap:3px;font-size:11px}
.heat .hl{color:var(--muted);font-weight:700;display:flex;align-items:center}
.heat .hh{color:var(--muted);font-weight:700;text-align:center;font-size:10.5px}
.heat .hc{aspect-ratio:1/1;border-radius:5px;background:var(--paper)}
.svc{display:grid;gap:10px}
.svcb{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;width:100%;min-height:72px}
.svcb:hover{border-color:var(--ink)}
.svcb .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--navy-soft);color:var(--ink);font:800 15px var(--display)}
.svcb.bad .ic{background:var(--coral-soft);color:var(--coral)}
.svcb.good .ic{background:var(--emerald-soft);color:var(--emerald-2)}
.svcb b{display:block;font:700 16px/1.2 var(--display)}
.svcb small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.svcb .r{text-align:right;font-variant-numeric:tabular-nums}
.svcb .r b{font-size:17px}
.svcb .r small{white-space:nowrap}
.avpet{flex:0 0 52px;width:52px;height:52px;border-radius:16px;background:var(--navy-soft);color:var(--ink);display:grid;place-items:center;font:800 18px var(--display)}
.aging{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ag{border-radius:12px;padding:10px;background:var(--paper);min-width:0}
.ag span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.ag b{display:block;font:700 15px var(--display);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag em{font-style:normal;font-size:12px;color:var(--muted)}
.ag.hot{background:var(--coral-soft)}.ag.hot b{color:var(--coral)}
.ag.ok{background:var(--emerald-soft)}.ag.ok b{color:var(--emerald-2)}
.uau{background:var(--ink);color:#fff;border-radius:18px;padding:18px;border:0;text-align:left;width:100%}
.uau span{display:block;font-size:12.5px;color:#B9C3D0;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.uau b{display:block;font:800 28px/1.1 var(--display);margin-top:6px;color:#FF8A75}
.uau p{color:#C9D2DD;font-size:14.5px;margin-top:8px}
.uau p strong{color:#fff}
.slider label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;color:#C9D2DD;margin:14px 0 4px}
.slider label b{color:#fff;font:700 18px var(--display)}
.slider input[type=range]{width:100%;accent-color:#5FD3A6;height:30px}
.simout .res b{font-size:22px;white-space:nowrap}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal7 .d{border-radius:10px;background:var(--paper);padding:8px 4px;text-align:center;font-size:12px;min-width:0}
.cal7 .d b{display:block;font:700 14px var(--display)}
.cal7 .d.pay{background:var(--emerald-soft)}
.cal7 .d.pay i{display:block;font-style:normal;font-weight:700;color:var(--emerald-2);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal7 .d.wk{color:var(--muted)}
.cal7 .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.privacy{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:6px}
.privacy svg{width:15px;height:15px;color:var(--emerald)}
.tb.wrap1 td:first-child{white-space:normal;min-width:110px}
</style>
</head>

<script>
(function(){
"use strict";
/* =========================================================
   Utilidades
   ========================================================= */
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
var NUM=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
var NUM1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
var NUM2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function R$(v){return BRL.format(Math.round(v)).replace(/ /g,' ')}
function mil(v){var a=Math.abs(v),s=v<0?'-':'';if(a>=1e6)return s+'R$ '+NUM2.format(a/1e6)+' mi';if(a>=1000)return s+'R$ '+(a>=100000?NUM.format(a/1000):NUM1.format(a/1000))+' mil';return s+'R$ '+NUM.format(a)}
function n(v){return NUM.format(Math.round(v))}
function n1(v){return NUM1.format(v)}
function n2(v){return NUM2.format(v)}
function pct(v,d){return (d===0?NUM.format(v):NUM1.format(v))+'%'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function sum(a,f){var s=0;for(var i=0;i<a.length;i++)s+=f?f(a[i],i):a[i];return s}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hr(){var h=2166136261;for(var i=0;i<arguments.length;i++){h^=arguments[i]+0x9e3779b9;h=Math.imul(h,16777619);h^=h>>>13}return mulberry(h)()}
function rr(n_,p){var k=0;for(var i=0;i<n_;i++)if(hr(p,i)<1)k+=0;return k}

/* =========================================================
   Datas
   ========================================================= */
var TODAY=new Date();TODAY.setHours(0,0,0,0);
var CY=TODAY.getFullYear(),CM=TODAY.getMonth(),TD=TODAY.getDate();
var MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var MNL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var WDS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],WDL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var WARM=4,NM=12,TOT=WARM+NM;
var G=[];for(var k0=TOT-1;k0>=0;k0--){var d0=new Date(CY,CM-k0,1);G.push({y:d0.getFullYear(),m:d0.getMonth(),t:TOT-1-k0,i:TOT-1-k0-WARM})}
var MONTHS=G.slice(WARM);
function addD(d,k){var x=new Date(d);x.setDate(x.getDate()+k);return x}
function days(a,b){return Math.round((b-a)/864e5)}
function ddmm(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')}
function ddmmyy(d){return ddmm(d)+'/'+d.getFullYear()}
function mlab(g){return MN[g.m]+'/'+String(g.y).slice(2)}
function isCur(g){return g.y===CY&&g.m===CM}
function refDate(g){return isCur(g)?TODAY:new Date(g.y,g.m+1,0)}
var HOL=['1-1','4-21','5-1','9-7','10-12','11-2','11-15','11-20','12-25'];
function biz(d){var w=d.getDay();return w!==0&&w!==6&&HOL.indexOf((d.getMonth()+1)+'-'+d.getDate())<0}
function nextBiz(d){d=new Date(d);while(!biz(d))d=addD(d,1);return d}

/* =========================================================
   O consultório
   ========================================================= */
var DOCS=[
  {id:0,n:'Dra. Marina Lopes',s:'Cardiologia',ini:'ML',slots:16,dias:[1,2,3,4,5],part:390,ns:.10},
  {id:1,n:'Dr. Ricardo Alves',s:'Clínica médica',ini:'RA',slots:14,dias:[1,2,4,5],part:300,ns:.15}
];
/* fontes: 0 = particular; 1..6 = convênios fictícios */
var SRC=[
  {k:'part',n:'Particular',v:null,mix:[.30,.22],glosa:0},
  {k:'alfa',n:'Convênio Alfa',v:150,mix:[.17,.15],glosa:.03,prazo:30,atraso:2},
  {k:'beta',n:'Saúde Beta',v:120,mix:[.15,.17],glosa:.045,prazo:45,atraso:3},
  {k:'gama',n:'Vida Gama',v:110,mix:[.12,.16],glosa:.085,prazo:60,atraso:4},
  {k:'delta',n:'Plano Delta',v:165,mix:[.10,.07],glosa:.025,prazo:30,atraso:1},
  {k:'eps',n:'Coop Épsilon',v:125,mix:[.09,.10],glosa:.055,prazo:45,atraso:5},
  {k:'zeta',n:'Saúde Zeta',v:85,mix:[.07,.13],glosa:.075,prazo:60,atraso:38}
];
var CONV=SRC.slice(1);
var MOTIVOS=['Guia incompleta','Falta de autorização','Código errado','Prazo de envio vencido'];
var MOTW={alfa:[.4,.2,.3,.1],beta:[.35,.3,.25,.1],gama:[.55,.25,.15,.05],delta:[.4,.2,.3,.1],eps:[.3,.35,.25,.1],zeta:[.3,.4,.2,.1]};
var PROCS=[
  {k:'ecg',n:'Eletrocardiograma',doc:0,rate:.32,part:120,conv:45,mat:6,min:15},
  {k:'holter',n:'Holter 24 horas',doc:0,rate:.045,part:350,conv:165,mat:62,min:40},
  {k:'mapa',n:'MAPA 24 horas',doc:0,rate:.035,part:300,conv:140,mat:55,min:40},
  {k:'amb',n:'Pequeno procedimento ambulatorial',doc:1,rate:.035,part:420,conv:190,mat:70,min:45}
];
var HOSP=[
  {k:'norte',n:'Hospital Exemplo Norte',v:1900,qt:4,prazo:15,atraso:2},
  {k:'sul',n:'Hospital Exemplo Sul',v:1500,qt:3,prazo:30,atraso:42}
];
var RET=.24;   /* parte dos atendimentos que é retorno, sem cobrança */
var LC=.05;    /* cancelamento em cima da hora */
var PAYF=[['Pix',.45,0,0],['Cartão de crédito',.25,.032,30],['Cartão de débito',.15,.015,1],['Dinheiro',.15,0,0]];

/* ---------- produção mês a mês ---------- */
function bizDays(g,dias){var nd=new Date(g.y,g.m+1,0).getDate(),lim=isCur(g)?TD:nd,c=0;for(var d=1;d<=lim;d++){var x=new Date(g.y,g.m,d);if(biz(x)&&dias.indexOf(x.getDay())>=0)c++}return c}
var PROD=G.map(function(g){
  var r={g:g,doc:[]};
  DOCS.forEach(function(D){
    var bd=bizDays(g,D.dias),slots=bd*D.slots,occ=.84+hr(g.t,D.id,1)*.08-(g.m===0||g.m===6?.06:0);
    var booked=Math.round(slots*occ),ns=Math.round(booked*(D.ns*(.85+hr(g.t,D.id,2)*.3))),lc=Math.round(booked*LC*(.7+hr(g.t,D.id,3)*.6)),att=booked-ns-lc;
    var src=SRC.map(function(s,si){return Math.round(att*s.mix[D.id]*(.9+hr(g.t,D.id,si,4)*.2))});
    var diff=att-sum(src);src[0]+=diff;
    var rows=SRC.map(function(s,si){var a=src[si],ret=Math.round(a*RET),con=a-ret,val=s.v||D.part;return{att:a,ret:ret,con:con,fat:con*val,val:val}});
    var proc=PROCS.map(function(P){if(P.doc!==D.id)return SRC.map(function(){return{q:0,fat:0,mat:0}});
      return SRC.map(function(s,si){var q=Math.round(rows[si].con*P.rate*(.85+hr(g.t,si,P.k.length,5)*.3));var v=si===0?P.part:P.conv;return{q:q,fat:q*v,mat:q*P.mat}})});
    r.doc.push({slots:slots,booked:booked,ns:ns,lc:lc,att:att,rows:rows,proc:proc});
  });
  /* plantões (Dr. Ricardo) */
  r.pl=HOSP.map(function(H,hi){var nd=new Date(g.y,g.m+1,0).getDate(),lim=isCur(g)?TD:nd,q=Math.round(H.qt*(lim/nd)*(.9+hr(g.t,hi,6)*.2));return{q:q,fat:q*H.v}});
  return r;
});
/* ---------- recebimentos: cada lote de convênio vira um repasse com data ---------- */
var LOTES=[],RCV=[],GLOSAS=[];
PROD.forEach(function(P,t){var g=P.g;
  CONV.forEach(function(C,ci){var si=ci+1;
    DOCS.forEach(function(D,di){
      var d=P.doc[di],fat=d.rows[si].fat+sum(d.proc,function(p){return p[si].fat});if(!fat)return;
      var envio=nextBiz(new Date(g.y,g.m+1,10)),gr=C.glosa*(.8+hr(t,si,di,7)*.4);
      if(C.k==='gama'&&t===TOT-4)gr=.16;  /* glosa alta no último lote fechado */
      var due=addD(envio,C.prazo),atr=Math.max(0,Math.round(C.atraso*(.6+hr(t,si,di,8)*.8))),pay=addD(due,atr);
      var gl=fat*gr,rec=fat-gl;
      var mw=MOTW[C.k],mot=mw.map(function(w){return gl*w*(.85+hr(t,si,w*100,9)*.3)}),mt=sum(mot);mot=mot.map(function(v){return v/mt*gl});
      var recurso=gl*.72,recup=recurso*(.5+hr(t,si,di,10)*.15),recupDate=addD(pay,55+Math.round(hr(t,si,11)*20));
      var L={t:t,g:g,ci:ci,si:si,doc:di,fat:fat,envio:envio,due:due,pay:pay,gl:gl,mot:mot,recurso:recurso,recup:recup,recupDate:recupDate,rec:rec};
      LOTES.push(L);
      RCV.push({d:pay,v:rec,kind:'conv',si:si,doc:di,L:L});
      RCV.push({d:recupDate,v:recup,kind:'recurso',si:si,doc:di,L:L});
    });
  });
  /* particular: pagamento na hora, cartão de crédito em 30 dias */
  DOCS.forEach(function(D,di){var d=P.doc[di],fat=d.rows[0].fat+sum(d.proc,function(p){return p[0].fat});
    PAYF.forEach(function(f,fi){var v=fat*f[1];var mid=new Date(g.y,g.m,15);RCV.push({d:addD(mid,f[3]),v:v*(1-f[2]),fee:v*f[2],gross:v,kind:'part',forma:fi,doc:di,t:t})})});
  /* plantões */
  HOSP.forEach(function(H,hi){var q=P.pl[hi];if(!q.q)return;var due=new Date(g.y,g.m+1,H.prazo),atr=Math.round(H.atraso*(.6+hr(t,hi,12)*.9));
    if(t===TOT-2&&hi===1)atr=200; /* plantões de setembro no hospital Sul: ainda não pagos */
    RCV.push({d:addD(due,atr),v:q.fat,kind:'plantao',hi:hi,doc:1,t:t,due:due,q:q.q})});
});
function inMonth(d,g){return d.getFullYear()===g.y&&d.getMonth()===g.m}
function rcvIn(g,doc,f){var ref=refDate(g),a=new Date(g.y,g.m,1);return RCV.filter(function(r){return r.d>=a&&r.d<=ref&&(doc==='all'||r.doc===+doc)&&(!f||f(r))})}
function openAt(ref,doc){return RCV.filter(function(r){var made=r.L?r.L.envio<=ref:(r.kind==='plantao'?new Date(PROD[r.t].g.y,PROD[r.t].g.m,28)<=ref:new Date(PROD[r.t].g.y,PROD[r.t].g.m,15)<=ref);return made&&r.d>ref&&(doc==='all'||r.doc===+doc)&&r.kind!=='recurso'})}

/* =========================================================
   Estado e filtros
   ========================================================= */
var ST={mi:11,doc:'all',tab:'geral',simF:30,simC:6,simR:40};
var TABS=[['geral','Visão geral'],['fontes','Receita por fonte'],['conv','Convênios'],['glosas','Glosas'],['agenda','Agenda e faltas'],['plantoes','Plantões'],['proc','Procedimentos'],['desp','Despesas'],['contador','Para o contador']];
function M(){return MONTHS[ST.mi]}
function T(){return WARM+ST.mi}
$('updDate').textContent=ddmmyy(TODAY);
$('fMonth').innerHTML=MONTHS.slice().reverse().map(function(g,j){return '<option value="'+(11-j)+'">'+MNL[g.m].replace(/^./,function(a){return a.toUpperCase()})+' '+g.y+'</option>'}).join('');
$('fDoc').innerHTML='<option value="all">Todos os médicos</option>'+DOCS.map(function(D){return '<option value="'+D.id+'">'+D.n+'</option>'}).join('');
$('fMonth').onchange=function(){ST.mi=+this.value;render()};
$('fDoc').onchange=function(){ST.doc=this.value;render()};
function drawTabs(){
  var late=lateConv().length;
  $('tabs').innerHTML=TABS.map(function(t){return '<button type="button" role="tab" aria-selected="'+(ST.tab===t[0])+'" data-t="'+t[0]+'">'+t[1]+(t[0]==='conv'&&late?'<span class="badge">'+late+'</span>':'')+'</button>'}).join('');
  var a=$('tabs').querySelector('[aria-selected="true"]'),tb=$('tabs');if(a&&tb.scrollWidth>tb.clientWidth)tb.scrollLeft=Math.max(0,a.offsetLeft-tb.clientWidth/2+a.offsetWidth/2);
}
$('tabs').onclick=function(e){var b=e.target.closest('button');if(b)go(b.dataset.t)};
function go(t){ST.tab=t;render();var bar=document.querySelector('.bar'),y=document.querySelector('main').offsetTop-bar.offsetHeight-6;if(window.scrollY>y)window.scrollTo({top:y,behavior:reduce?'auto':'smooth'})}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-tip]'))return;
  var b=e.target.closest('[data-go]');if(b){go(b.dataset.go);return}
  var c=e.target.closest('[data-conv]');if(c){openConv(+c.dataset.conv);return}
});

/* números animados */
var prevVals={};
var FMT={brl:R$,mil:mil,n:n,pct:function(v){return pct(v)},pct0:function(v){return pct(v,0)},d:function(v){return n(v)+' dias'}};
function kpi(id,label,val,fmt,cls,sub){return '<div class="kpi"><span>'+label+'</span><b id="'+id+'" class="'+(cls||'')+'" data-to="'+val+'" data-fmt="'+fmt+'">'+FMT[fmt](prevVals[id]!=null?prevVals[id]:val)+'</b>'+(sub?'<em>'+sub+'</em>':'')+'</div>'}
function count(el,to,fmt){var from=+(el.dataset.v||0);el.dataset.v=to;if(reduce||from===to){el.textContent=fmt(to);return}var t0=performance.now();(function s(t){var k=Math.min((t-t0)/600,1),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(s)})(t0)}
function runCounts(root){
  root.querySelectorAll('[data-to]').forEach(function(el){var to=+el.dataset.to;el.dataset.v=prevVals[el.id]!=null?prevVals[el.id]:to;count(el,to,FMT[el.dataset.fmt]);prevVals[el.id]=to});
  root.querySelectorAll('[data-w]').forEach(function(el){requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.width=el.dataset.w+'%'})})});
}

/* =========================================================
   Gráficos SVG
   ========================================================= */
function chartBox(id,h){return '<div class="chart" id="'+id+'" data-h="'+(h||200)+'"><div class="tip"></div></div>'}
function W(id){var el=$(id);return el?Math.max(260,el.clientWidth):600}
function svgOpen(w,h,lab){return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="'+esc(lab)+'">'}

function bindSim(rows){

  var all=RCV.filter(function(r){return r.kind==='plantao'&&r.t-WARM>=i0&&r.t-WARM<=ST.mi});
  var paid=all.filter(function(r){return r.d<=ref}),open=all.filter(function(r){return r.d>ref}),late=open.filter(function(r){return r.due<ref});

  h+=kpi('p2','Recebido em 12 meses',sum(paid,function(r){return r.v}),'mil','g');

  if(late.length)h+='<div class="insight c stack">'+IC.warn+'<div>O '+HOSP[1].n+' está com '+R$(sum(late.filter(function(r){return r.hi===1}),function(r){return r.v}))+' atrasados. Vale pedir a previsão de pagamento por escrito e avaliar se compensa pegar novos plantões lá até regularizar.</div></div>';

/* =========================================================

function vProc(){
  var g=M(),t=T(),doc=ST.doc,i0=Math.max(0,ST.mi-2);
  var rows=PROCS.map(function(P_,pi){var q=0,f=0,m=0;for(var i=i0;i<=ST.mi;i++){var p=prod(WARM+i,doc);q+=p.proc[pi].q;f+=p.proc[pi].fat;m+=p.proc[pi].mat}var tempo=q*P_.min/60*150;return{P:P_,q:q,f:f,m:m,tempo:tempo,res:f-m-tempo}}).filter(function(r){return r.q});
  var h=head('Procedimentos','Quantidade, receita, custo de material e margem de cada procedimento. O tempo do médico entra a R$ 150 por hora.','últimos 3 meses');
  var F=sum(rows,function(r){return r.f}),Mt=sum(rows,function(r){return r.m}),Rs=sum(rows,function(r){return r.res});
  h+='<div class="grid g2 k3">';
  h+=kpi('r1','Receita de procedimentos',F,'mil');
  h+=kpi('r2','Material',Mt,'brl','',pct(F?Mt/F*100:0)+' da receita');
  h+=kpi('r3','Margem',F?Rs/F*100:0,'pct0','g','depois de material e tempo');
  h+='</div><div class="svc stack">';
  rows.sort(function(a,b){return b.res-a.res}).forEach(function(r){var mg=r.f?r.res/r.f*100:0;h+='<div class="svcb'+(mg<20?' bad':' good')+'" style="cursor:default"><span class="ic">'+r.P.n.charAt(0)+'</span><span><b>'+r.P.n+'</b><small>'+n(r.q)+' feitos · '+R$(r.P.part)+' particular, '+R$(r.P.conv)+' convênio · material '+R$(r.P.mat)+'</small></span><span class="r"><b class="'+(mg<20?'c':'g')+'">'+pct(mg,0)+'</b><small>'+R$(r.res)+'</small></span></div>'});
  h+='</div>';
  var hol=rows.filter(function(r){return r.P.k==='holter'})[0];
  if(hol)h+='<div class="insight stack">'+IC.bulb+'<div>No convênio, o Holter paga '+R$(hol.P.conv)+' e gasta '+R$(hol.P.mat)+' de material, além de 40 minutos de instalação e laudo. No particular ('+R$(hol.P.part)+') a margem é mais que o dobro. Vale divulgar o pacote particular.</div></div>';
  $('v-proc').innerHTML=h;
}

/* =========================================================

function vDesp(){
  var g=M(),t=T(),e=EXP[t],D=expT(t),rc=sum(rcvIn(g,'all'),function(r){return r.v}),res=rc-D,orc=sum(EXC,function(k){return e.b[k]});
  var h=head('Despesas e resultado','Para onde vai o dinheiro do consultório e quanto sobra no mês, pelo que entrou de fato no caixa.',ST.doc!=='all'?'Despesas são do consultório todo':'');
  h+='<div class="grid g2 k4">';
  h+=kpi('d1','Recebido',rc,'mil','g');
  h+=kpi('d2','Despesas',D,'mil','',orc?(D>orc*1.05?'<span class="c" style="font-weight:700">+'+pct((D/orc-1)*100)+'</span> acima do orçado':pct((D/orc)*100,0)+' do orçado'):'');
  h+=kpi('d3','Resultado do mês',res,'mil',res>=0?'g':'c',rc?pct(res/rc*100,0)+' do recebido':'');
  h+=kpi('d4','Resultado 12 meses',sum(MONTHS,function(gm,i){return sum(rcvIn(gm,'all'),function(r){return r.v})-expT(WARM+i)}),'mil','','antes do pró-labore');
  h+='</div>';
  h+='<div class="card stack"><div class="ch"><h2>Orçado x realizado</h2><small>'+MN[g.m]+'</small></div><div class="tbw"><table class="tb tight wrap1"><thead><tr><th>Despesa (R$)</th><th>Orçado</th><th>Real</th><th>Dif.</th></tr></thead><tbody>';
  EXC.forEach(function(k){var o=e.b[k],r=e.o[k],d=o?(r/o-1)*100:0;h+='<tr><td><b>'+k+'</b></td><td>'+n(o)+'</td><td>'+n(r)+'</td><td class="'+(d>15?'c':'')+'">'+(o?(d>=0?'+':'')+pct(d,0):'—')+'</td></tr>'});
  h+='</tbody><tfoot><tr><td>Total</td><td>'+n(orc)+'</td><td>'+n(D)+'</td><td>'+(orc?(D>=orc?'+':'')+pct((D/orc-1)*100,0):'')+'</td></tr></tfoot></table></div>'+(isCur(g)?'<p class="muted" style="font-size:13px;margin-top:8px">Mês em andamento: só entram as contas que já venceram.</p>':'')+'</div>';
  h+='<div class="card stack"><div class="ch"><h2>Recebido x despesas, 12 meses</h2><div class="lg"><span><i style="background:var(--emerald)"></i>Recebido</span><span><i style="background:#9AA5B2"></i>Despesas</span></div></div>'+chartBox('cRes',200)+'</div>';
  $('v-desp').innerHTML=h;
  bars12('cRes',[{c:'#0E8A63',v:MONTHS.map(function(gm){return sum(rcvIn(gm,'all'),function(r){return r.v})})},{c:'#9AA5B2',v:MONTHS.map(function(_,i){return expT(WARM+i)})}],{tip:function(i){var gm=MONTHS[i],a=sum(rcvIn(gm,'all'),function(r){return r.v}),b=expT(WARM+i);return mlab(gm)+': recebido '+R$(a)+' · despesas '+R$(b)+' · sobra '+R$(a-b)},label:'Recebido e despesas por mês'});
}

/* =========================================================
   9. Para o contador
   ========================================================= */
var FONTES=['Particular','Convênios','Recurso de glosa','Plantões'];
function recLines(gm,doc){var rc=rcvIn(gm,doc||'all'),L=[];
  PAYF.forEach(function(f,fi){var v=sum(rc.filter(function(r){return r.kind==='part'&&r.forma===fi}),function(r){return r.gross});if(v)L.push({f:'Particular',forma:f[0],v:v})});
  CONV.forEach(function(c,ci){var v=sum(rc.filter(function(r){return r.kind==='conv'&&r.si===ci+1}),function(r){return r.v});if(v)L.push({f:'Convênios',forma:'Repasse '+c.n,v:v});var w=sum(rc.filter(function(r){return r.kind==='recurso'&&r.si===ci+1}),function(r){return r.v});if(w)L.push({f:'Recurso de glosa',forma:'Repasse '+c.n,v:w})});
  HOSP.forEach(function(H,hi){var v=sum(rc.filter(function(r){return r.kind==='plantao'&&r.hi===hi}),function(r){return r.v});if(v)L.push({f:'Plantões',forma:H.n,v:v})});
  return L}
function vContador(){
  var g=M(),t=T(),L=recLines(g),R=sum(L,function(x){return x.v}),D=expT(t);
  var h=head('Pronto para o contador','Receitas separadas por fonte e forma de recebimento, despesas por categoria e mês. Serve para pessoa física (carnê-leão) ou jurídica.','Consultório todo, pelo caixa');
  h+='<div class="grid g2 k4">';
  h+=kpi('x1','Recebido em '+MN[g.m],sum(L,function(x){return x.v}),'mil');
  h+=kpi('x2','Despesas de '+MN[g.m],D,'mil');
  h+=kpi('x3','Taxas de cartão',EXP[t].o['Taxas de cartão'],'brl','','já descontadas pela maquininha');
  h+=kpi('x4','Recebido em 12 meses',sum(MONTHS,function(gm){return sum(recLines(gm),function(x){return x.v})}),'mil');
  h+='</div>';
  h+='<div class="card stack"><div class="ch"><h2>Exportar</h2><small>CSV que abre no Excel</small></div><div class="btns"><button class="dl" type="button" id="csvAll">'+IC.dl+'Baixar os 12 meses</button><button class="dl line" type="button" id="csvMonth">'+IC.dl+'Só '+MNL[g.m]+'</button></div><p class="muted" style="font-size:13px;margin-top:12px">Sem dado de paciente: só valores por fonte, forma de recebimento e categoria. Particular aparece pelo valor bruto, e a taxa do cartão vai em despesas.</p></div>';
  var byF={};L.forEach(function(x){byF[x.f]=(byF[x.f]||0)+x.v});
  h+='<div class="grid split2 stack"><div class="card"><div class="ch"><h2>Receitas por fonte</h2><small>'+MN[g.m]+'</small></div><div class="hb">';
  var mx=Math.max.apply(null,Object.keys(byF).map(function(k){return byF[k]}))||1;
  FONTES.forEach(function(f){if(!byF[f])return;h+='<div><div class="l"><b>'+f+'</b><span>'+R$(byF[f])+' · '+pct(byF[f]/R*100,0)+'</span></div><div class="t"><i class="k" data-w="'+(byF[f]/mx*100)+'"></i></div></div>'});
  h+='</div></div><div class="card"><div class="ch"><h2>Por forma de recebimento</h2><small>'+MN[g.m]+'</small></div><ul class="rows">'+L.map(function(x){return '<li><div class="row"><span class="nm">'+x.forma+'<small>'+x.f+'</small></span><span class="vl">'+R$(x.v)+'</span></div></li>'}).join('')+'</ul></div></div>';
  h+='<div class="card stack"><div class="ch"><h2>Mês a mês</h2></div><div class="tbw"><table class="tb tight"><thead><tr><th>R$ mil</th><th>Recebido</th><th>Despesas</th><th>Resultado</th></tr></thead><tbody>';
  var tR=0,tD=0;MONTHS.forEach(function(gm,i){var a=sum(recLines(gm),function(x){return x.v}),b=expT(WARM+i);tR+=a;tD+=b;h+='<tr style="'+(i===ST.mi?'background:var(--paper)':'')+'"><td><b>'+mlab(gm)+'</b></td><td>'+n1(a/1000)+'</td><td>'+n1(b/1000)+'</td><td style="font-weight:600" class="'+(a-b<0?'c':'')+'">'+n1((a-b)/1000)+'</td></tr>'});
  h+='</tbody><tfoot><tr><td>Total</td><td>'+n1(tR/1000)+'</td><td>'+n1(tD/1000)+'</td><td>'+n1((tR-tD)/1000)+'</td></tr></tfoot></table></div></div>';
  $('v-contador').innerHTML=h;
  $('csvAll').onclick=function(){csv(MONTHS.map(function(_,i){return i}),'clinica-medica-exemplo-fechamento-12-meses.csv')};
  $('csvMonth').onclick=function(){csv([ST.mi],'clinica-medica-exemplo-fechamento-'+MN[g.m].toLowerCase()+'-'+g.y+'.csv')};
}
function csv(idx,name){
  var out=['Competência;Tipo;Fonte;Forma ou categoria;Valor (R$)'],f=function(v){return n2(v).replace(/\./g,'')};
  idx.forEach(function(i){var gm=MONTHS[i],c=MN[gm.m]+'/'+gm.y;
    recLines(gm).forEach(function(x){out.push([c,'Receita',x.f,x.forma,f(x.v)].join(';'))});
    EXC.forEach(function(k){var v=EXP[WARM+i].o[k];if(v)out.push([c,'Despesa','',k,'-'+f(v)].join(';'))})});
  var blob=new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}

var lastFocus=null;
function openConv(ci){
  var c=CONV[ci],si=ci+1,doc=ST.doc,s=convStats(ci,doc,Math.max(0,ST.mi-11),ST.mi),sm=convStats(ci,doc,ST.mi,ST.mi);
  var h='<div class="grab"></div><div class="sh-h"><div style="display:flex;gap:12px;align-items:center"><span class="avpet">'+c.n.split(' ').pop().charAt(0)+'</span><div><h3 id="shTitle">'+c.n+'</h3><p>Prazo contratual de '+c.prazo+' dias · '+R$(c.v)+' por consulta</p></div></div><button class="xbtn" type="button" id="shX" aria-label="Fechar">'+IC.x+'</button></div>';
  h+='<div class="kv"><div><span>Atendimentos em '+MN[M().m]+'</span><b>'+n(sm.att)+'</b></div><div><span>Valor líquido por consulta</span><b>'+R$(c.v*(1-(s.fat?s.gl/s.fat:0)))+'</b></div><div><span>Faturado em 12 meses</span><b>'+mil(s.fat)+'</b></div><div><span>Glosa</span><b class="'+(s.gl/s.fat>.07?'c':'')+'">'+pct(s.fat?s.gl/s.fat*100:0)+'</b></div><div><span>Prazo real de pagamento</span><b class="'+(s.pz>c.prazo+15?'c':'')+'">'+n(s.pz)+' dias</b></div><div><span>Em aberto hoje</span><b>'+R$(s.open)+'</b></div></div>';
  if(s.late)h+='<div class="insight c" style="margin-top:12px">'+IC.warn+'<div>'+R$(s.late)+' já passaram do prazo e não foram pagos.</div></div>';
  var mo=MOTIVOS.map(function(_,k){return sum(LOTES.filter(function(L){return L.ci===ci&&L.t-WARM>ST.mi-12&&L.t-WARM<=ST.mi&&(doc==='all'||L.doc===+doc)}),function(L){return L.mot[k]})}),mt=sum(mo)||1;
  h+='<div class="sec"><h4>Glosas por motivo (12 meses)</h4><div class="hb">'+MOTIVOS.map(function(m,k){return '<div><div class="l"><b>'+m+'</b><span>'+R$(mo[k])+'</span></div><div class="t"><i class="'+(k===0?'c':'k')+'" style="width:'+(mo[k]/mt*100)+'%"></i></div></div>'}).join('')+'</div><p class="muted" style="font-size:13px;margin-top:8px">Recuperado com recurso: '+R$(s.recup)+' de '+R$(s.gl)+'.</p></div>';
  var ls=LOTES.filter(function(L){return L.ci===ci&&(doc==='all'||L.doc===+doc)&&L.envio<=TODAY}).slice(-8).reverse();
  h+='<div class="sec"><h4>Lotes e repasses</h4><ul class="rows">'+ls.map(function(L){var st=L.pay<=TODAY?'<span class="pill g">Pago '+ddmm(L.pay)+'</span>':L.due<TODAY?'<span class="pill c">Atrasado '+days(L.due,TODAY)+' d</span>':'<span class="pill">Previsto '+ddmm(L.due)+'</span>';return '<li><div class="row" style="min-height:48px;padding:8px 0"><span class="nm">Lote de '+mlab(L.g)+'<small>'+DOCS[L.doc].n+' · enviado '+ddmm(L.envio)+' · glosa '+R$(L.gl)+'</small></span><span class="vl">'+R$(L.rec)+'<small>'+st+'</small></span></div></li>'}).join('')+'</ul></div>';
  h+='<div class="sec"><h4>Faturado por mês</h4>'+chartBox('cCv',140)+'</div>';
  var sh=$('sheet');sh.innerHTML=h;sh.scrollTop=0;lastFocus=document.activeElement;$('scrim').classList.add('on');sh.classList.add('on');sh.setAttribute('aria-hidden','false');
  $('shX').onclick=closeSheet;setTimeout(function(){$('shX').focus({preventScroll:true})},60);
  bars12('cCv',[{c:'#5C6B80',v:MONTHS.map(function(_,i){return sum(LOTES.filter(function(L){return L.ci===ci&&L.t===WARM+i&&(doc==='all'||L.doc===+doc)}),function(L){return L.fat})})}],{tip:function(i){return mlab(MONTHS[i])+': '+R$(sum(LOTES.filter(function(L){return L.ci===ci&&L.t===WARM+i&&(doc==='all'||L.doc===+doc)}),function(L){return L.fat}))},label:'Faturado por mês'});
}
function closeSheet(){var sh=$('sheet');sh.classList.remove('on');$('scrim').classList.remove('on');sh.setAttribute('aria-hidden','true');if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
$('scrim').onclick=closeSheet;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('sheet').classList.contains('on'))closeSheet()});
(function(){var sh=$('sheet'),y0=null;sh.addEventListener('touchstart',function(e){y0=sh.scrollTop<=0?e.touches[0].clientY:null},{passive:true});sh.addEventListener('touchend',function(e){if(y0!=null&&e.changedTouches[0].clientY-y0>90)closeSheet();y0=null},{passive:true})})();

var VIEWS={geral:vGeral,fontes:vFontes,conv:vConv,glosas:vGlosas,agenda:vAgenda,plantoes:vPlantoes,proc:vProc,desp:vDesp,contador:vContador};

window.__demo={PROD:PROD,LOTES:LOTES,RCV:RCV,EXP:EXP,MONTHS:MONTHS,prod:prod,rcvIn:rcvIn,openAt:openAt,convStats:convStats,recLines:recLines,expT:expT,ST:ST,go:go,openConv:openConv,render:render,WARM:WARM,NEXTW:NEXTW};
})();

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Clínica | Parreira Gestão</title>
<meta name="description" content="Demonstração: painel de gestão para clínica veterinária. Atendimentos, lucro por serviço, retorno de pacientes, agenda, estoque, pet shop, contas e fechamento para o contador. Dados fictícios.">
<meta name="theme-color" content="#F4F6F8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F1A2B'/%3E%3Cpath d='M9 22v-6M16 22V10M23 22v-9' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='9' r='2.4' fill='%235FD3A6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#F4F6F8;--white:#FFFFFF;--ink:#0F1A2B;--ink-2:#3B4757;--muted:#6B7684;
  --line:#E2E7ED;--line-2:#D3DAE2;--emerald:#0E8A63;--emerald-2:#0B6E4F;--emerald-soft:#E3F3EC;
  --coral:#D9482F;--coral-soft:#FBE9E5;--navy-soft:#E8EDF4;
  --earth:#9A7449;--earth-soft:#F3ECE2;--amber:#9A5B00;--amber-soft:#FFF4E5;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:Figtree,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--emerald);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{padding:14px 0 6px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:26px;height:26px}
.brand b{display:block;font:700 17px/1.15 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;flex:0 0 auto}
.upd i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 3px var(--emerald-soft);margin-right:6px;vertical-align:1px}

/* barra fixa */
.bar{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0 4px}
.sel{position:relative;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;width:100%;font:600 15px var(--body);color:var(--ink);background:var(--white);border:1px solid var(--line-2);border-radius:999px;padding:10px 32px 10px 14px;min-height:46px;cursor:pointer;text-overflow:ellipsis}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;padding:12px 12px 13px;min-height:48px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--emerald)}
.tabs .badge{display:inline-block;min-width:19px;padding:0 5px;margin-left:5px;border-radius:99px;font-size:11.5px;line-height:19px;text-align:center;background:var(--coral);color:#fff;vertical-align:1px}

main{padding:16px 0 24px}
.view{display:none}
.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vh{margin:4px 0 14px}
.vh h1{font:800 26px/1.1 var(--display);letter-spacing:-.025em}
.vh p{color:var(--ink-2);margin-top:4px;max-width:64ch}
.filt-note{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600;color:var(--emerald-2);background:var(--emerald-soft);padding:5px 12px;border-radius:999px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.stack{margin-top:12px}
.col{display:grid;gap:12px;min-width:0;align-content:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{font:700 16.5px/1.25 var(--display);letter-spacing:-.01em}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card .ch small{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.c{color:var(--coral)}.g{color:var(--emerald)}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--white);border:1px solid var(--line);padding:16px 16px 0;margin-bottom:12px}
.hero h1{font:800 25px/1.1 var(--display);letter-spacing:-.025em;position:relative}
.hero p{color:var(--ink-2);margin-top:4px;position:relative;max-width:46ch}
.hero svg{display:block;width:100%;height:44px;margin-top:10px}

/* kpis */
.kpi{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.kpi span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.kpi b{display:block;font:700 22px/1.15 var(--display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.kpi em strong{font-weight:700}
.kpi b.c{color:var(--coral)}.kpi b.g{color:var(--emerald)}
.up{color:var(--emerald-2);font-weight:700}

/* alertas */
.alist{list-style:none}
.alist li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.alist li:first-child{border-top:0;padding-top:4px}
.aic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--navy-soft);color:var(--ink-2)}
.aic svg{width:20px;height:20px}
.aic.hot{background:var(--coral);color:#fff}
.aic.warn{background:var(--amber-soft);color:var(--amber)}
.aic.ok{background:var(--emerald-soft);color:var(--emerald-2)}
.alist .t{font-weight:600;line-height:1.3}
.alist .t small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.go{border:0;background:var(--paper);color:var(--emerald-2);font-weight:700;font-size:14px;cursor:pointer;padding:10px 12px;border-radius:12px;min-height:44px;white-space:nowrap}

/* barras horizontais */
.hb{display:grid;gap:12px}
.hb .l{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.hb .l b{font-weight:600}
.hb .l span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .t{height:10px;background:var(--paper);border-radius:9px;overflow:hidden;position:relative}
.hb .t i{display:block;height:100%;border-radius:9px;background:var(--emerald);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hb .t i.k{background:var(--ink)}.hb .t i.m{background:#9AA5B2}.hb .t i.c{background:var(--coral)}.hb .t i.e{background:var(--earth)}
.hb .t .mark{position:absolute;top:-1px;bottom:-1px;width:3px;border-radius:2px;background:var(--ink)}
.trk{height:12px;background:var(--line);border-radius:9px;overflow:hidden;display:flex}
.trk i{display:block;height:100%;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* listas */
.rows{list-style:none}
.rows li{border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;min-height:56px;width:100%;text-align:left;background:none;border:0}
button.row{cursor:pointer}
.row .nm{font-weight:600;line-height:1.3;min-width:0}
.row .nm small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.row .vl{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .vl small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
button.row:hover .nm{color:var(--emerald-2)}
.more{display:block;width:100%;margin-top:6px;padding:12px;min-height:46px;border:1px dashed var(--line-2);border-radius:12px;background:none;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--navy-soft);color:var(--ink-2)}
.pill.c{background:var(--coral);color:#fff}.pill.cs{background:var(--coral-soft);color:var(--coral)}.pill.g{background:var(--emerald-soft);color:var(--emerald-2)}.pill.w{background:var(--amber-soft);color:var(--amber)}.pill.e{background:var(--earth-soft);color:var(--earth)}

/* gráficos */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;z-index:3}
.tip.on{opacity:1}

/* rebanho fecha */
.eq{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.eq span{color:var(--ink-2)}
.eq b{text-align:right}
.eq .tot{border-top:2px solid var(--ink);padding-top:6px;margin-top:4px;font-weight:700;color:var(--ink)}
.ok-tag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:700;font-size:13.5px;color:var(--emerald-2);background:var(--emerald-soft);padding:6px 12px;border-radius:999px}
.ok-tag svg{width:16px;height:16px}

/* calendário reprodutivo */
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.strip .mh{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.strip .mh.now{color:var(--ink)}
.band{grid-column:var(--a)/var(--b);height:22px;border-radius:6px}
.bl{font-size:13px;font-weight:600;color:var(--ink-2);margin:10px 0 4px}
.nowline{position:relative}

/* lotes */
.lots{display:grid;gap:12px}
.lot{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;width:100%;display:block}
.lot:hover{border-color:var(--ink)}
.lot.sel{border-color:var(--emerald);box-shadow:0 0 0 2px var(--emerald-soft)}
.lot .lh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lot .lh b{font:700 16.5px/1.2 var(--display)}
.lot .lh small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.lot .big{font:700 24px var(--display);margin-top:10px;font-variant-numeric:tabular-nums}
.lot .big small{font:500 13px var(--body);color:var(--muted)}
.lot .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.lot .meta b{color:var(--ink)}

/* pasto */
.pqgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pq{border-radius:14px;padding:12px;background:var(--paper);border:1px solid transparent;min-width:0;text-align:left}
.pq.use{background:var(--emerald-soft)}
.pq.over{background:var(--coral-soft);border-color:#F2C2B8}
.pq.rest{background:var(--earth-soft)}
.pq.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.pq b{display:block;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq .v{font:700 18px var(--display);margin-top:6px;font-variant-numeric:tabular-nums}
.pq .v small{display:inline;font:600 12px var(--body)}
.pq.over .v{color:var(--coral)}
.pq .cap{height:6px;border-radius:9px;background:rgba(15,26,43,.08);margin-top:6px;overflow:hidden}
.pq .cap i{display:block;height:100%;border-radius:9px;background:var(--emerald)}
.pq.over .cap i{background:var(--coral)}
.pq.rest .cap i{background:var(--earth)}

/* tabelas */
.tbw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;padding-left:0}
.tb td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb td:first-child{white-space:normal}.tb.tight td:first-child{white-space:nowrap}
.tb.tight{font-size:13px}.tb.tight th,.tb.tight td{padding-left:4px;padding-right:4px}
.tb tr:last-child td{border-bottom:0}
.tb tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.tb td small{display:block;color:var(--muted);font-size:12px}

/* segmentado */
.seg{display:inline-flex;background:var(--paper);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 14px;min-height:40px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* simulador */
.sim{background:var(--ink);color:#fff;border-radius:18px;padding:18px;border:0}
.sim h2{font:700 18px var(--display);color:#fff}
.sim p.s{color:#B9C3D0;font-size:14px;margin-top:4px}
.sim label{display:block;font-size:13px;font-weight:600;color:#B9C3D0;margin:14px 0 6px}
.sim .sel select{background:#1B2940;border-color:#2C3B55;color:#fff}
.sim .sel::after{border-color:#B9C3D0}
.pricebox{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.pricebox button{height:52px;border-radius:14px;border:0;background:#1B2940;color:#fff;font:700 22px var(--display);cursor:pointer}
.pricebox input{height:52px;width:100%;border-radius:14px;border:1px solid #2C3B55;background:#1B2940;color:#fff;text-align:center;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.sim input[type=range]{width:100%;margin-top:12px;accent-color:#5FD3A6;height:28px}
.simout{margin-top:14px;display:grid;gap:0;border-top:1px solid rgba(255,255,255,.12)}
.simout div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.simout div span{color:#C9D2DD}
.simout .res{border-bottom:0;padding-top:12px}
.simout .res span{color:#fff;font-weight:700}
.simout .res b{font:800 26px var(--display)}
.simout .res b.pos{color:#5FD3A6}.simout .res b.neg{color:#FF8A75}
.simnote{margin-top:10px;font-size:13.5px;color:#C9D2DD;background:#1B2940;border-radius:12px;padding:10px 12px}
.simnote b{color:#fff}

.insight{display:flex;gap:10px;align-items:flex-start;background:var(--emerald-soft);border-radius:12px;padding:12px;font-size:14px}
.insight svg{flex:0 0 18px;width:18px;height:18px;color:var(--emerald-2);margin-top:2px}
.insight.c{background:var(--coral-soft)}.insight.c svg{color:var(--coral)}
.insight.e{background:var(--earth-soft)}.insight.e svg{color:var(--earth)}

.dl{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;font-weight:700;font-size:15px;padding:12px 18px;min-height:48px;cursor:pointer;text-decoration:none}
.dl svg{width:18px;height:18px}
.dl.line{background:var(--white);color:var(--ink);border:1px solid var(--line-2)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* detalhe */
.scrim{position:fixed;inset:0;background:rgba(15,26,43,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--white);border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;padding:8px 16px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line-2);margin:4px auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-h h3{font:800 22px/1.15 var(--display);letter-spacing:-.02em}
.sh-h p{color:var(--muted);font-size:13.5px;margin-top:3px}
.xbtn{flex:0 0 46px;width:46px;height:46px;border-radius:14px;border:0;background:var(--paper);cursor:pointer;display:grid;place-items:center}
.xbtn svg{width:20px;height:20px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.kv div{background:var(--paper);border-radius:12px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{display:block;font:700 17px var(--display);margin-top:2px;font-variant-numeric:tabular-nums}
.sec{margin-top:18px}
.sec h4{font:700 15px var(--display);margin-bottom:8px}

footer{padding:8px 0 40px}
.cta{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;justify-items:start}
.cta p{font:700 18px/1.25 var(--display);letter-spacing:-.015em}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--emerald);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 20px;border-radius:999px;min-height:54px;width:100%}
.wa:hover{background:var(--emerald-2)}
.wa svg{width:20px;height:20px}
.disc{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.disc a{color:inherit}

@media (min-width:720px){
  .wrap{padding:0 24px}
  .tabs{margin:0 -24px;padding:0 24px}
  .filters{grid-template-columns:260px 300px;justify-content:start}
  .k3{grid-template-columns:repeat(3,1fr)!important}
  .k4{grid-template-columns:repeat(4,1fr)!important}
  .split{grid-template-columns:1.2fr 1fr}
  .split2{grid-template-columns:1fr 1fr}
  .lots{grid-template-columns:1fr 1fr}
  .pqgrid{grid-template-columns:repeat(3,1fr)}
  .vh h1,.hero h1{font-size:32px}
  .kpi b{font-size:26px}
  .cta{grid-template-columns:1fr auto;align-items:center}
  .wa{width:auto}
  .sheet{left:auto;top:0;bottom:0;width:480px;max-height:none;border-radius:20px 0 0 20px;transform:translateX(105%);padding:18px 22px}
  .grab{display:none}
  .hero svg{height:60px}
}
@media (min-width:1024px){.pqgrid{grid-template-columns:repeat(4,1fr)}.lots{grid-template-columns:repeat(3,1fr)}}
@media (max-width:370px){.kpi b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* clínica */
.heat{display:grid;grid-template-columns:34px repeat(11,1fr);gap:3px;font-size:11px}
.heat .hl{color:var(--muted);font-weight:700;display:flex;align-items:center}
.heat .hh{color:var(--muted);font-weight:700;text-align:center}

<script>
(function(){
"use strict";
/* =========================================================
   Utilidades
   ========================================================= */
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
var NUM=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
var NUM1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
var NUM2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function R$(v){return BRL.format(Math.round(v)).replace(/ /g,' ')}
function mil(v){var a=Math.abs(v),s=v<0?'-':'';if(a>=1e6)return s+'R$ '+NUM2.format(a/1e6)+' mi';if(a>=1000)return s+'R$ '+(a>=100000?NUM.format(a/1000):NUM1.format(a/1000))+' mil';return s+'R$ '+NUM.format(a)}
function n(v){return NUM.format(Math.round(v))}
function n1(v){return NUM1.format(v)}
function n2(v){return NUM2.format(v)}
function pct(v,d){return (d===0?NUM.format(v):NUM1.format(v))+'%'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function sum(a,f){var s=0;for(var i=0;i<a.length;i++)s+=f?f(a[i]):a[i];return s}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hr(){var h=2166136261;for(var i=0;i<arguments.length;i++){h^=arguments[i]+0x9e3779b9;h=Math.imul(h,16777619);h^=h>>>13}return mulberry(h)()}
var R=mulberry(20261029);
function rnd(a,b){return a+R()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
function pick(a){return a[Math.floor(R()*a.length)]}
function wp(o,r){var t=0,k;for(k in o)t+=o[k];var x=(r==null?R():r)*t;for(k in o){x-=o[k];if(x<=0)return k}return k}

/* =========================================================
   Datas
   ========================================================= */
var TODAY=new Date();TODAY.setHours(0,0,0,0);
var CY=TODAY.getFullYear(),CM=TODAY.getMonth(),TD=TODAY.getDate();
var MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var MNL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var WDS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var MONTHS=[];for(var k0=11;k0>=0;k0--){var d0=new Date(CY,CM-k0,1);MONTHS.push({y:d0.getFullYear(),m:d0.getMonth(),i:11-k0})}
var WSTART=new Date(MONTHS[0].y,MONTHS[0].m,1);
function isCur(g){return g.y===CY&&g.m===CM}
function refDate(g){return isCur(g)?TODAY:new Date(g.y,g.m+1,0)}
function mlab(g){return MN[g.m]+'/'+String(g.y).slice(2)}
function ddmm(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')}
function ddmmyy(d){return ddmm(d)+'/'+d.getFullYear()}
function days(a,b){return Math.round((b-a)/864e5)}
function addD(d,k){var x=new Date(d);x.setDate(x.getDate()+k);return x}
var HOL=['1-1','4-21','5-1','9-7','10-12','11-2','11-15','11-20','12-25'];
function open_(d){return d.getDay()!==0&&HOL.indexOf((d.getMonth()+1)+'-'+d.getDate())<0}
function idxOf(d){for(var i=0;i<12;i++){var g=MONTHS[i];if(d.getFullYear()===g.y&&d.getMonth()===g.m)return i}return d<WSTART?-1:12}

/* =========================================================
   A clínica
   ========================================================= */
var VETS=[{id:0,n:'Dra. Helena Prado',s:'Sócia · cirurgia'},{id:1,n:'Dr. Caio Ribeiro',s:'Clínica e grandes animais'},{id:2,n:'Dra. Bruna Teixeira',s:'Clínica e felinos'}];
var VET_H=60,AUX_H=25,TOSA_H=28; /* custo da hora: salário + encargos ÷ horas */
var SVC=[
  {k:'consulta',n:'Consultas'},{k:'vacina',n:'Vacinas'},{k:'exame',n:'Exames'},{k:'cirurgia',n:'Cirurgias'},
  {k:'internacao',n:'Internação'},{k:'banho',n:'Banho e tosa'},{k:'externo',n:'Atendimento externo'}
];
var SVK={};SVC.forEach(function(s,i){SVK[s.k]=i});
/* estoque de medicamentos e vacinas: custo unitário, mínimo, lote de compra, validade em meses */
var ITEMS=[
  {k:'v10',n:'Vacina V10 (cães)',u:'dose',c:38,min:40,lot:120,life:14,g:'Vacinas'},
  {k:'raiva',n:'Vacina antirrábica',u:'dose',c:12,min:80,lot:200,life:18,g:'Vacinas'},
  {k:'v4',n:'Vacina V4 (gatos)',u:'dose',c:48,min:15,lot:50,life:14,g:'Vacinas'},
  {k:'gripe',n:'Vacina gripe canina',u:'dose',c:45,min:10,lot:60,life:12,g:'Vacinas'},
  {k:'verm',n:'Vermífugo (comprimido)',u:'comp.',c:7,min:60,lot:200,life:24,g:'Medicamentos'},
  {k:'amox',n:'Amoxicilina + clavulanato',u:'frasco',c:32,min:15,lot:40,life:24,g:'Medicamentos'},
  {k:'melox',n:'Meloxicam injetável',u:'frasco',c:24,min:6,lot:15,life:24,g:'Medicamentos'},
  {k:'dipi',n:'Dipirona injetável',u:'ampola',c:2,min:80,lot:300,life:24,g:'Medicamentos'},
  {k:'ceft',n:'Ceftriaxona',u:'frasco',c:9,min:20,lot:60,life:24,g:'Medicamentos'},
  {k:'soro',n:'Soro fisiológico 500 mL',u:'bolsa',c:5,min:60,lot:200,life:24,g:'Medicamentos'},
  {k:'prop',n:'Propofol',u:'frasco',c:28,min:10,lot:30,life:24,g:'Anestesia'},
  {k:'iso',n:'Isoflurano 100 mL',u:'frasco',c:185,min:3,lot:8,life:36,g:'Anestesia'},
  {k:'ceta',n:'Cetamina (controlado)',u:'frasco',c:60,min:3,lot:8,life:24,g:'Anestesia'},
  {k:'tram',n:'Tramadol injetável (controlado)',u:'ampola',c:6,min:30,lot:100,life:24,g:'Anestesia'},
  {k:'fio',n:'Fio de sutura',u:'unid.',c:14,min:20,lot:60,life:36,g:'Cirúrgico'},
  {k:'kit',n:'Kit cirúrgico descartável',u:'kit',c:38,min:10,lot:30,life:36,g:'Cirúrgico'},
  {k:'ser',n:'Seringas e agulhas',u:'caixa',c:45,min:4,lot:12,life:48,g:'Cirúrgico'}
];
var IK={};ITEMS.forEach(function(it,i){IK[it.k]=i});
var NAMES_C=['Thor','Mel','Luna','Bob','Nina','Fred','Pipoca','Bidu','Belinha','Max','Amora','Toddy','Lola','Zeus','Pandora','Paçoca','Scooby','Kiara','Rex','Lili','Cookie','Bento','Chico','Maya','Theo','Duque','Sansão','Pretinha','Fiona','Ozzy','Café','Jade','Simba','Malu','Tobias','Babi','Pingo','Floquinho','Nala','Apolo'];
var NAMES_G=['Mingau','Frajola','Mia','Salem','Tom','Garfield','Nala','Bolinha','Mimi','Nino','Felícia','Lua','Tigrinho','Pérola','Chanel','Fumaça','Manchinha','Kiko','Sushi','Oliver'];
var BREED_C=['SRD','SRD','SRD','Shih-tzu','Shih-tzu','Poodle','Lhasa apso','Yorkshire','Pinscher','Golden','Labrador','Spitz alemão','Buldogue francês','Border collie','Pit bull','Dachshund'];
var BREED_G=['SRD','SRD','SRD','Siamês','Persa','Maine coon'];
var TUT=['Ana','Carla','Paulo','Márcia','José','Luciana','Renato','Fernanda','Sérgio','Patrícia','Juliana','Roberto','Cláudia','Marcos','Simone','Fábio','Daniela','Rogério','Eliane','Gustavo','Tatiane','Leandro','Vanessa','Adriana','Wellington','Priscila','Edson','Cristina'];
var LETTERS='ABCDFGLMNOPRSTV';
var FARMS=['Sítio Boa Esperança','Fazenda Santa Luzia','Sítio Três Irmãos','Fazenda Água Limpa','Sítio São Bento','Fazenda Recanto','Sítio Ipê','Fazenda Cachoeira','Haras Estrela','Sítio Pôr do Sol','Fazenda Bela Vista','Sítio Aroeira','Fazenda Córrego Fundo','Sítio Primavera','Fazenda Pedra Branca','Sítio Paraíso','Fazenda Serrinha','Sítio Buriti'];

/* ---------- pacientes ---------- */
var PETS=[];
(function(){
  var NOLD=1940,NEW=31;
  function mk(since,isNew){
    var cat=R()<.3,sp=cat?'Gato':'Cão',nm=pick(cat?NAMES_G:NAMES_C);
    var p={id:PETS.length,nm:nm,sp:sp,br:pick(cat?BREED_G:BREED_C),age:isNew?ri(0,2):ri(1,13),tut:pick(TUT)+' '+LETTERS.charAt(ri(0,LETTERS.length-1))+'.',since:since,isNew:isNew,
      comp:R()<.12?rnd(.2,.5):rnd(.78,.98),vet:+wp({0:.32,1:.3,2:.38}),porte:cat?'P':wp({P:.5,M:.32,G:.18}),groom:!cat&&R()<.17,gi:ri(21,42),gp:ri(0,40)};
    if(cat&&R()<.15)p.vet=2;
    /* alguns param de vir */
    p.end=null;if(!isNew&&R()<.17){var a=days(since,TODAY);p.end=addD(TODAY,-ri(120,Math.max(130,Math.min(a,760))));if(p.end<since)p.end=addD(since,30)}
    else if(R()<.03)p.end=addD(TODAY,-ri(40,170));
    PETS.push(p);return p;
  }
  for(var i=0;i<NOLD;i++){var s=new Date(2015+Math.floor(R()*((WSTART.getFullYear()-2015)+1)),ri(0,11),ri(1,28));if(s>=WSTART)s=addD(WSTART,-ri(10,300));mk(s,false)}
  MONTHS.forEach(function(g){var nd=isCur(g)?TD:new Date(g.y,g.m+1,0).getDate(),q=Math.round(NEW*(.85+hr(g.i,5)*.3)*(isCur(g)?TD/new Date(g.y,g.m+1,0).getDate():1));
    for(var j=0;j<q;j++){var d=new Date(g.y,g.m,1+Math.floor(hr(g.i,j,8)*nd));if(!open_(d))d=addD(d,1);if(d>TODAY)d=TODAY;mk(d,true)}});
})();
function aliveAt(p,d){return p.since<=d&&(!p.end||d<=p.end)}
/* vacina anual: no aniversário do cadastro, se o tutor for cumpridor naquele ano */
function vaxDate(p,y){var d=new Date(y,p.since.getMonth(),Math.min(p.since.getDate(),28));if(d.getDay()===0)d=addD(d,1);return d}
function vaxed(p,y){if(y<p.since.getFullYear())return false;if(y===p.since.getFullYear())return true;var d=vaxDate(p,y);return aliveAt(p,d)&&hr(p.id,y,3)<p.comp}
function vaxHistory(p,upTo){var a=[];for(var y=p.since.getFullYear();y<=upTo.getFullYear();y++){var d=y===p.since.getFullYear()?p.since:vaxDate(p,y);if(d<=upTo&&vaxed(p,y))a.push(d)}return a}

/* =========================================================
   Atendimentos (evento a evento)
   ========================================================= */
var EV=[];
var CIR={'Castração gata':[480,60,.22],'Castração cadela':[720,90,.22],'Castração macho':[400,45,.2],'Nodulectomia':[950,90,.1],'Profilaxia dentária':[480,60,.14],'Cirurgia ortopédica':[2800,180,.06],'Cesariana':[1500,120,.06]};
var CIRDAYS={'Castração gata':0,'Castração cadela':1,'Castração macho':0,'Nodulectomia':1,'Profilaxia dentária':0,'Cirurgia ortopédica':3,'Cesariana':2};
var HOURS={8:6,9:9,10:10,11:8,12:2,13:4,14:8,15:9,16:8,17:6};
function hourFor(d,seed,kind){if(d.getDay()===6)return 8+Math.floor(hr(seed,4)*4);if(kind==='cir')return 8+Math.floor(hr(seed,4)*3);if(kind==='ext')return 7+Math.floor(hr(seed,4)*6);return +wp(HOURS,hr(seed,4))}
function cons(o){var c=0;for(var k in o)c+=o[k]*ITEMS[IK[k]].c;return c}
function pay(kind,seed){var r=hr(seed,91);
  if(kind==='cirurgia')return wp({'Cartão parcelado':.55,'Pix':.24,'Débito':.06,'Boleto da clínica':.15},r);
  if(kind==='internacao')return wp({'Cartão parcelado':.5,'Pix':.35,'Débito':.15},r);
  if(kind==='externo')return wp({'Boleto da clínica':.7,'Pix':.3},r);
  return wp({'Pix':.4,'Crédito':.31,'Débito':.22,'Dinheiro':.07},r);}
function addEv(e){e.mi=idxOf(e.d);if(e.mi<0||e.mi>11||e.d>TODAY)return null;e.pay=pay(e.t,e.seed);e.cost=e.ins+e.third+e.vm/60*VET_H+e.am/60*AUX_H+e.tm/60*TOSA_H;EV.push(e);return e}
var seed=1;
/* vacinas */
PETS.forEach(function(p){
  [MONTHS[0].y,CY].forEach(function(y,ix){if(ix===1&&y===MONTHS[0].y)return;
    var d=y===p.since.getFullYear()?p.since:vaxDate(p,y);if(d<WSTART||d>TODAY||!vaxed(p,y))return;
    var it={verm:1,raiva:1,ser:.02};if(p.sp==='Gato')it.v4=1;else{it.v10=1;if(hr(p.id,y,9)<.04)it.gripe=1}
    var price=(p.sp==='Gato'?125:115)+65+(it.gripe?70:0);
    addEv({t:'vacina',d:d,pet:p.id,vet:p.vet===0&&hr(p.id,y)<.5?1:p.vet,price:price,ins:cons(it),it:it,third:0,vm:15,am:0,tm:0,sub:p.sp==='Gato'?'V4 + antirrábica':'V10 + antirrábica'+(it.gripe?' + gripe':''),seed:seed++,hour:hourFor(d,seed),isNewPet:p.isNew&&d.getTime()===p.since.getTime()});
  });
});
/* consultas, exames, internações clínicas */
var alive=PETS;
MONTHS.forEach(function(g){
  var nd=isCur(g)?TD:new Date(g.y,g.m+1,0).getDate(),seas=[1.05,1,1,1,1.05,1.08,1.1,1,.98,1,1.03,1.12][g.m];
  var q=Math.round(305*seas*(1+g.i*.008)*(isCur(g)?TD/new Date(g.y,g.m+1,0).getDate():1));
  /* consultas de pets novos */
  PETS.forEach(function(p){if(p.isNew&&p.since.getFullYear()===g.y&&p.since.getMonth()===g.m){q--;mkCons(p,p.since,g)}});
  for(var j=0;j<q;j++){
    var d=new Date(g.y,g.m,1+Math.floor(hr(g.i,j,1)*nd));var t=0;while(!open_(d)&&t++<3)d=addD(d,1);if(d>TODAY)d=addD(TODAY,0);
    var p,tries=0;do{p=PETS[Math.floor(hr(g.i,j,tries,2)*PETS.length)];tries++}while((!aliveAt(p,d))&&tries<40);
    mkCons(p,d,g);
  }
});
function mkCons(p,d,g){
  var s=seed++,ret=hr(s,1)<.14,it={ser:.02};if(hr(s,2)<.22)it.amox=1;if(hr(s,3)<.08)it.melox=1;if(hr(s,4)<.3)it.dipi=1;
  var vet=hr(s,5)<.7?p.vet:+wp({0:.25,1:.35,2:.4},hr(s,6));
  var e=addEv({t:'consulta',d:d,pet:p.id,vet:vet,price:ret?80:(d.getDay()===6?180:150),ins:cons(it),it:it,third:0,vm:ret?20:35,am:0,tm:0,sub:ret?'Retorno':'Consulta',seed:s,hour:hourFor(d,s),isNewPet:p.isNew&&d.getTime()===p.since.getTime()});

function lastVisit(p,ref){var lv=null;for(var k=EV.length-1;k>=0;k--){var e=EV[k];if(e.pet===p.id&&e.d<=ref){lv=e.d;break}}if(!lv){if(p.end&&p.end<=ref)lv=p.end;else if(p.since<=ref)lv=p.since<WSTART?addD(WSTART,-ri(1,90)):p.since}return lv}
var LV_CACHE={};
function retorno(i){
  if(LV_CACHE[i])return LV_CACHE[i];
  var ref=refDate(MONTHS[i]),lastBy={};
  EV.forEach(function(e){if(e.pet!=null&&e.d<=ref&&(!lastBy[e.pet]||e.d>lastBy[e.pet]))lastBy[e.pet]=e.d});
  var soon=[],late=[],gone=[];
  PETS.forEach(function(p){if(p.since>ref)return;
    var hist=vaxHistory(p,ref),last=hist[hist.length-1],next=last?addD(last,365):null;
    var lv=lastBy[p.id]||(p.end&&p.end<=ref?p.end:(p.since<WSTART?addD(WSTART,-(5+Math.floor(hr(p.id,77)*80))):p.since));
    var o={p:p,last:last,next:next,lv:lv};
    if(next&&next>ref&&days(ref,next)<=30&&(!p.end||p.end>ref))soon.push(o);
    else if(next&&next<=ref&&days(next,ref)<=90&&(!p.end||p.end>ref))late.push(o);
    if(days(lv,ref)>180&&days(lv,ref)<=720&&(!next||days(next,ref)>90||(p.end&&p.end<=ref)))gone.push(o);
  });
  soon.sort(function(a,b){return a.next-b.next});late.sort(function(a,b){return b.next-a.next});gone.sort(function(a,b){return b.lv-a.lv});
  return (LV_CACHE[i]={soon:soon,late:late,gone:gone,ref:ref});
}

function occ(i,vid){var g=MONTHS[i],used=sum(BYM[i].filter(function(e){return e.vet===vid}),function(e){return e.t==='internacao'?e.vm:e.vm});return used/capMin(g)*100}

  var h='<div class="sh-h"><div style="display:flex;gap:12px;align-items:center"><span class="avpet">'+IC['s_'+s.k]+'</span><div><h3 id="shTitle">'+s.n+'</h3><p>'+MNL[g.m]+' de '+g.y+(ST.vet!=='all'?' · '+VETS[+ST.vet].n:'')+'</p></div></div><button class="xbtn" type="button" id="shX" aria-label="Fechar">'+IC.x+'</button></div>';
  h+='<div class="kv"><div><span>Quantidade</span><b>'+n(o.q)+'</b></div><div><span>Receita</span><b>'+R$(o.rev)+'</b></div><div><span>Custo direto</span><b>'+R$(o.cost)+'</b></div><div><span>Lucro</span><b class="'+(o.res<0?'c':'g')+'">'+R$(o.res)+'</b></div><div><span>Margem</span><b>'+pct(o.mg*100,0)+'</b></div><div><span>Lucro por hora</span><b class="'+(o.res<0?'c':'')+'">'+R$(o.ph)+'</b></div></div>';
  h+='<div class="sec"><h4>De onde vem o custo</h4><div class="hb">';
  [['Insumos e medicamentos',o.ins,'k'],[s.k==='externo'?'Combustível':s.k==='banho'?'Água e energia':'Laboratório',o.third,'e'],['Tempo da equipe ('+n(o.min/60)+' h)',o.time,'m']].forEach(function(x){if(!x[1])return;h+='<div><div class="l"><b>'+x[0]+'</b><span>'+R$(x[1])+' · '+pct(o.cost?x[1]/o.cost*100:0,0)+'</span></div><div class="t"><i class="'+x[2]+'" style="width:'+(o.cost?x[1]/o.cost*100:0)+'%"></i></div></div>'});
  h+='</div></div>';
  h+='<div class="sec"><h4>Por tipo</h4><ul class="rows">'+Object.keys(subs).sort(function(a,b){return subs[b].r-subs[a].r}).map(function(k2){var x=subs[k2];return '<li><div class="row"><span class="nm">'+k2+'<small>'+x.q+' · preço médio '+R$(x.r/x.q)+'</small></span><span class="vl '+(x.r-x.c<0?'c':'')+'">'+R$(x.r-x.c)+'<small>margem '+pct((x.r-x.c)/x.r*100,0)+'</small></span></div></li>'}).join('')+'</ul></div>';
  if(s.k!=='banho'){h+='<div class="sec"><h4>Por veterinário</h4><div class="hb">';VETS.forEach(function(v){var e=ev.filter(function(x){return x.vet===v.id});if(!e.length)return;h+='<div><div class="l"><b>'+v.n+'</b><span>'+e.length+' · '+R$(sum(e,function(x){return x.price}))+'</span></div><div class="t"><i class="k" style="width:'+(e.length/ev.length*100)+'%"></i></div></div>'});h+='</div></div>'}
  h+='<div class="sec"><h4>Lucro, 12 meses</h4>'+chartBox('cSv',150)+'</div>';
  openSheet(h,function(){lines12('cSv',[{n:'Lucro',c:'#0E8A63',v:MONTHS.map(function(_,j){return svcStats(j,j,ST.vet)[k].res})}],{label:'Lucro do serviço por mês'})});
}
function openPet(id){
  var p=PETS[id],ref=refDate(M()),hist=vaxHistory(p,ref),vis=EV.filter(function(e){return e.pet===id&&e.d<=ref}).slice(-8).reverse();
  var last=hist[hist.length-1],next=last?addD(last,365):null,verm=last?addD(last,182):null;
  if(verm&&verm<=ref)verm=addD(verm,182);
  var h='<div class="sh-h"><div style="display:flex;gap:12px;align-items:center"><span class="avpet">'+IC.paw+'</span><div><h3 id="shTitle">'+esc(p.nm)+'</h3><p>'+p.sp+' · '+p.br+' · '+(p.age?p.age+' ano'+(p.age>1?'s':''):'filhote')+' · tutor(a) '+esc(p.tut)+'</p></div></div><button class="xbtn" type="button" id="shX" aria-label="Fechar">'+IC.x+'</button></div>';
  h+='<div class="kv"><div><span>Cliente desde</span><b>'+ddmmyy(p.since)+'</b></div><div><span>Veterinário</span><b style="font-size:15px">'+VETS[p.vet].n+'</b></div><div><span>Próxima vacina</span><b class="'+(next&&next<=ref?'c':'')+'">'+(next?ddmmyy(next):'—')+'</b></div><div><span>Próximo vermífugo</span><b>'+(verm?ddmmyy(verm):'—')+'</b></div></div>';
  h+='<div class="sec"><h4>Vacinas</h4>'+(hist.length?'<ul class="rows">'+hist.slice().reverse().map(function(d,k){return '<li><div class="row" style="min-height:48px;padding:8px 0"><span class="nm">'+(p.sp==='Gato'?'V4 felina + antirrábica':'V10 + antirrábica')+'<small>'+ddmmyy(d)+(k===0?' · última':'')+'</small></span><span class="vl"><span class="pill g">Aplicada</span></span></div></li>'}).join('')+'</ul>':'<p class="muted">Sem vacinas registradas.</p>')+'</div>';
  if(next&&next<=ref)h+='<div class="insight c" style="margin-top:8px">'+IC.syr+'<div>A vacina anual venceu em '+ddmmyy(next)+'. Vale mandar um lembrete.</div></div>';
  h+='<div class="sec"><h4>Últimos atendimentos</h4>'+(vis.length?'<ul class="rows">'+vis.map(function(e){return '<li><div class="row" style="min-height:48px;padding:8px 0"><span class="nm">'+SVC[SVK[e.t]].n.replace(/s$/,'')+' · '+e.sub+'<small>'+ddmmyy(e.d)+(e.vet!=null?' · '+VETS[e.vet].n:'')+'</small></span><span class="vl">'+R$(e.price)+'</span></div></li>'}).join('')+'</ul>':'<p class="muted">Nenhum atendimento nos últimos 12 meses.</p>')+'</div>';
  if(next){h+='<div class="sec"><h4>Lembrete</h4><div class="msg">Olá, '+esc(p.tut.split(' ')[0])+'! Aqui é da Clínica Veterinária Exemplo. A vacina anual do '+esc(p.nm)+' '+(next<=ref?'venceu em ':'vence em ')+ddmm(next)+'. Quer agendar? 🐾</div><p class="muted" style="font-size:12.5px;margin-top:6px">Dados fictícios. Na sua clínica, o botão abre a conversa com o tutor.</p></div>'}
  openSheet(h);
}
